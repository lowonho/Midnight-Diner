<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>INGREDIENT_SELECT_PENDING</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/minigame-parts.css" />
  <link rel="stylesheet" href="../css/minigame-frame.css" />
  <link rel="stylesheet" href="../css/ingredient-select.css" />
  <style>
    /* 본 게임의 .game-frame 과 같은 값입니다(16:9 + border 2px).
       ⚠️ 100vw x 100vh 로 두면 세로가 16:9 가 아니라 3열 실측 세로가 어긋납니다. */
    body{margin:0;display:grid;place-items:center;min-height:100vh;background:#100a06}
    .game-frame{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;border:2px solid #5d3920;background:#17100d;overflow:hidden}
    #testResult{position:fixed;z-index:100;left:8px;bottom:8px;padding:6px 10px;background:#111;color:#fff;font:14px monospace}
  </style>
</head>
<body>
  <main class="game-frame">
    <section id="menuSelectOverlay" class="overlay"></section>
    <!-- index.html 의 #ingredientSelectOverlay 와 같은 구조입니다(공용 프레임 · 하단 띠 없는 3열) -->
    <section id="ingredientSelectOverlay" class="overlay mini-overlay ingredient-select-overlay" role="dialog" aria-modal="true" aria-labelledby="ingredientSelectTitle">
      <div class="mini-window" aria-hidden="true"></div>
      <div class="mini-stage">
        <div class="mini-content">
          <div class="fridge-scene">
            <aside class="fridge-col">
              <div class="fridge-panel fridge-menu-panel">
                <h3 class="fridge-col-title starred">오늘의 요리</h3>
                <div id="ingredientDishGallery" class="fridge-dish-list"></div>
                <p id="ingredientPantryNote" class="fridge-pantry-note"></p>
              </div>
            </aside>
            <div class="fridge-play">
              <div class="fridge-cabinet">
                <div id="ingredientGrid" class="fridge-slots" aria-label="냉장고 24칸"></div>
              </div>
            </div>
            <aside class="fridge-right">
              <div class="fridge-panel fridge-count-card">
                <h3 class="fridge-col-title">완료 개수</h3>
                <p id="ingredientTotalProgress" class="fridge-count"><b>0</b> / 0</p>
                <p id="ingredientTimer" class="fridge-time"><span>걸린 시간</span><b>00:00</b></p>
              </div>
              <div class="fridge-panel fridge-goal-card">
                <h3 class="fridge-col-title">찾아야 할 재료</h3>
                <div id="ingredientChecklist" class="fridge-goal-list"></div>
              </div>
            </aside>
          </div>
        </div>
      </div>
      <div class="mini-tip">
        <span class="mini-tip-label" aria-hidden="true">TIP</span>
        <div class="mini-tip-body">
          <p class="mini-description">냉장고에서 필요한 재료를 클릭해 찾아주세요!</p>
          <p id="ingredientSelectFeedback" class="mini-feedback" role="status" aria-live="polite"></p>
        </div>
        <span class="mini-tip-hint">클릭 · 재료 선택</span>
      </div>
      <div class="mini-title-panel">
        <p class="mini-station">오늘의 메뉴에 필요한 재료를 찾아주세요!</p>
        <h2 id="ingredientSelectTitle">냉장고 재료 찾기</h2>
      </div>
    </section>
  </main>
  <output id="testResult">PENDING</output>
  <script src="../game-data.js"></script>
  <script>
    const DISHES=MENU_DATA.map(menu=>({...menu,name:menu.displayName,prepTasks:[...menu.requiredPrepTasks]}));
    const smokeAllMenus=new URLSearchParams(location.search).has("all");
    const state={screen:"game",phase:GAME_PHASES.MENU_SELECT,paused:false,selectedMenus:smokeAllMenus?MENU_DATA.map(menu=>menu.id):["oden","tteokbokki"],ingredientSelection:null};
    const ids=["menuSelectOverlay","ingredientSelectOverlay","ingredientSelectTitle","ingredientDishGallery","ingredientChecklist","ingredientPantryNote","ingredientGrid","ingredientSelectFeedback","ingredientTotalProgress","ingredientTimer"];
    const dom=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    // 자리만 바꾸는 진짜 섞기(씨앗 고정). game.js 의 shuffle 과 같은 성질입니다.
    let seed=20260806;
    const random=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
    const shuffle=items=>{const copy=[...items];for(let i=copy.length-1;i>0;i-=1){const j=Math.floor(random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;};
    const dishById=id=>DISHES.find(dish=>dish.id===id)||null;
    const foodFiles={oden:"food_eomuk_tang",tofu:"food_dubu_kimchi",kimchi:"food_kimchijeon",skewer:"food_dak_kkochi",yakisoba:"food_bokkeum_udon",shrimpTempura:"food_saeu_twigim",tteokbokki:"food_tteokbokki",fries:"food_gamja_twigim"};
    const foodPropUrl=id=>foodFiles[id]?`../assets/food/prop/${foodFiles[id]}_normal.webp`:"";
    const audio={bad(){},success(){}};
    const saveGame=()=>true,updateUI=()=>{},showToast=()=>{};
  </script>
  <script src="../engine-e13-fridge-find.js"></script>
  <script src="../ingredient-select.js"></script>
  <script>
    const visual=new URLSearchParams(location.search).has("visual");
    try{
      startIngredientSelection();
      if(!visual){
        const assert=(condition,message)=>{if(!condition)throw new Error(message)};
        const progress=()=>state.ingredientSelection;
        const required=allRequiredIngredientIds();
        const slotButton=id=>ingredientGrid.querySelector(`[data-slot="${progress().slots.indexOf(id)}"]`);

        assert(progress().engine==="E13","E13 engine state");
        assert(progress().slots.length===24,"24 fridge slots");
        assert(required.every(id=>progress().slots.filter(slot=>slot===id).length===1),"one of every required ingredient");
        assert(!required.includes("anchovy")&&!required.includes("gochujang"),"pantry ingredients excluded");
        assert(progress().slots.filter(id=>!required.includes(id)).length===24-required.length,"the rest is filled with distractors");
        assert(progress().slots.some(id=>FRIDGE_EXTRAS[id]),"fridge-only extras appear too");
        assert(ingredientPantryNote.textContent.includes("멸치")&&ingredientPantryNote.textContent.includes("고추장"),"pantry note rendered");
        assert(ingredientGrid.querySelectorAll("[data-slot]").length===24,"every slot is drawn");
        assert(ingredientDishGallery.querySelectorAll(".fridge-dish").length===state.selectedMenus.length,"today's dishes are listed");
        assert(ingredientChecklist.querySelectorAll(".fridge-goal").length===required.length,"goal panel lists every required ingredient");
        assert(ingredientTotalProgress.textContent.replace(/\s/g,"")===`0/${required.length}`,"progress starts at zero");
        assert(ingredientTimer.querySelector("b").textContent==="00:00","elapsed time starts at zero");
        assert(!("pork" in FRIDGE_INGREDIENTS)&&!ingredientRecipe("tofu").includes("pork"),"pork removed from fridge and tofu kimchi");
        assert(ingredientInfo("chicken").asset.endsWith("assets/minigame/E1/chicken-0.png"),"original chicken asset used");
        assert(ingredientInfo("onion").css==="onion","assetless extras fall back to a css shape");

        // 오늘 안 쓰는 재료를 눌러도 사라지지 않습니다
        const wrongIndex=progress().slots.findIndex(id=>id&&!required.includes(id));
        ingredientGrid.querySelector(`[data-slot="${wrongIndex}"]`).click();
        assert(progress().slots[wrongIndex]!==null&&progress().misses===1,"wrong pick keeps the ingredient in place");
        assert(ingredientSelectFeedback.textContent.includes("오늘 쓰지 않아요"),"wrong pick explains itself");

        // 필요한 재료를 누르면 칸이 비고 개수가 오릅니다
        slotButton(required[0]).click();
        assert(progress().found.includes(required[0]),"required ingredient is collected");
        assert(ingredientTotalProgress.textContent.replace(/\s/g,"")===`1/${required.length}`,"progress counts up");
        assert(ingredientChecklist.querySelector(".fridge-goal.done"),"goal panel marks the found ingredient");
        assert(ingredientGrid.querySelector(`[data-slot="${progress().slots.length&&progress().slots.indexOf(null)}"]`).classList.contains("empty"),"picked slot is drawn empty");

        required.slice(1).forEach(id=>slotButton(id).click());
        assert(currentIngredientRoundComplete(),"finding everything completes the round");
        assert(document.querySelector(".fridge-clear"),"clear banner is shown");
        continueIngredientSelection();
        assert(state.phase===GAME_PHASES.PREP,"continues to prep");

        state.phase=GAME_PHASES.MENU_SELECT;state.selectedMenus=["fries"];
        startIngredientSelection();
        assert(state.phase===GAME_PHASES.PREP,"menu without refrigerated ingredients skips the fridge");
        document.title="INGREDIENT_SELECT_OK";testResult.textContent="INGREDIENT_SELECT_OK";
      }else{
        document.title="INGREDIENT_SELECT_VISUAL";testResult.hidden=true;
        /* 3열·냉장고 실측값을 body 에 심어 둡니다 — --dump-dom 으로 읽습니다.
           기준은 3열 1360.2 x 613.2 (좌 250 + 18 + 가운데 824.2 + 18 + 우 250). */
        const rect=element=>{const box=element.getBoundingClientRect();return `${box.width.toFixed(1)}x${box.height.toFixed(1)}`};
        const scene=document.querySelector(".fridge-scene");
        document.body.dataset.scene=rect(scene);
        document.body.dataset.cols=[...scene.children].map(rect).join(" | ");
        document.body.dataset.cabinet=rect(document.querySelector(".fridge-cabinet"));
        document.body.dataset.slots=`${ingredientGrid.querySelectorAll("[data-slot]").length}칸 ${rect(ingredientGrid.querySelector('[data-slot="0"]'))}`;
        document.body.dataset.strip=String(!!scene.querySelector(".mg-strip"));
      }
    }catch(error){document.title="INGREDIENT_SELECT_FAIL";testResult.textContent=`INGREDIENT_SELECT_FAIL ${error.stack||error}`;}
  </script>
</body>
</html>
