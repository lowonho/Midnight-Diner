<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>INGREDIENT_SELECT_PENDING</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/ingredient-select.css" />
  <style>
    body{margin:0;background:#100a06}.game-frame{position:relative;width:100vw;height:100vh;overflow:hidden}
    #testResult{position:fixed;z-index:100;left:8px;bottom:8px;padding:6px 10px;background:#111;color:#fff;font:14px monospace}
  </style>
</head>
<body>
  <main class="game-frame">
    <section id="menuSelectOverlay" class="overlay"></section>
    <section id="ingredientSelectOverlay" class="overlay ingredient-select-overlay" role="dialog" aria-modal="true" aria-labelledby="ingredientSelectTitle">
      <div class="ingredient-select-window wood-panel">
        <header class="ingredient-select-header"><div><p class="eyebrow">OPEN THE FRIDGE</p><h2 id="ingredientSelectTitle">냉장고에서 재료를 골라주세요!</h2><p>시간 제한은 없어요. 요리에 필요한 재료를 천천히 찾아보세요.</p></div><span id="ingredientDishProgress" class="ingredient-dish-progress"></span></header>
        <div class="ingredient-select-layout">
          <aside class="ingredient-recipe-card"><span>오늘의 요리</span><h3 id="ingredientDishName"></h3><div class="ingredient-dish-picture"><img id="ingredientDishImage" alt="" /></div><strong>필요한 재료</strong><div id="ingredientChecklist" class="ingredient-checklist"></div></aside>
          <section class="ingredient-fridge"><div class="ingredient-fridge-light"></div><div id="ingredientGrid" class="ingredient-grid"></div><p id="ingredientSelectFeedback" class="ingredient-select-feedback"></p></section>
          <aside class="ingredient-basket-card"><span>장바구니</span><div id="ingredientBasket" class="ingredient-basket"></div><strong id="ingredientTotalProgress" class="ingredient-total-progress"></strong><button id="ingredientSelectContinue" class="gold-button ingredient-continue" type="button" disabled>다음 요리</button><small>잘못 골라도 괜찮아요.<br />잠시 기다리면 재료가 반짝여요.</small></aside>
        </div>
      </div>
    </section>
  </main>
  <output id="testResult">PENDING</output>
  <script src="../game-data.js"></script>
  <script>
    const DISHES=MENU_DATA.map(menu=>({...menu,name:menu.displayName,prepTasks:[...menu.requiredPrepTasks]}));
    const state={screen:"game",phase:GAME_PHASES.MENU_SELECT,paused:false,selectedMenus:["oden","tteokbokki"],ingredientSelection:null};
    const ids=["menuSelectOverlay","ingredientSelectOverlay","ingredientSelectTitle","ingredientDishProgress","ingredientDishName","ingredientDishImage","ingredientChecklist","ingredientGrid","ingredientSelectFeedback","ingredientBasket","ingredientTotalProgress","ingredientSelectContinue"];
    const dom=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const shuffle=items=>[...items].reverse();
    const dishById=id=>DISHES.find(dish=>dish.id===id)||null;
    const foodFiles={oden:"food_eomuk_tang",tofu:"food_dubu_kimchi",tteokbokki:"food_tteokbokki"};
    const foodPropUrl=id=>foodFiles[id]?`../assets/food/prop/${foodFiles[id]}_normal.webp`:"";
    const saveGame=()=>true,updateUI=()=>{},showToast=()=>{};
  </script>
  <script src="../ingredient-select.js"></script>
  <script>
    const visual=new URLSearchParams(location.search).has("visual");
    try{
      startIngredientSelection();
      if(!visual){
        const assert=(condition,message)=>{if(!condition)throw new Error(message)};
        assert(state.ingredientSelection.board.length===12,"board size");
        assert(ingredientRecipe("oden").every(id=>state.ingredientSelection.board.includes(id)),"recipe on board");
        const wrong=state.ingredientSelection.board.find(id=>!ingredientRecipe("oden").includes(id));
        selectIngredient(wrong);
        assert(state.ingredientSelection.picked.length===0,"wrong pick has no penalty/state change");
        ingredientRecipe("oden").forEach(id=>selectIngredient(id));
        assert(currentIngredientRoundComplete(),"first dish complete");
        continueIngredientSelection();
        assert(state.ingredientSelection.menuIndex===1,"second dish opened");
        assert(state.ingredientSelection.picked.includes("fishCake"),"shared ingredient retained");
        ingredientRecipe("tteokbokki").forEach(id=>selectIngredient(id));
        continueIngredientSelection();
        assert(state.phase===GAME_PHASES.PREP,"continues to prep");
        document.title="INGREDIENT_SELECT_OK";testResult.textContent="INGREDIENT_SELECT_OK";
      }else{document.title="INGREDIENT_SELECT_VISUAL";testResult.hidden=true;}
    }catch(error){document.title="INGREDIENT_SELECT_FAIL";testResult.textContent=`INGREDIENT_SELECT_FAIL ${error.stack||error}`;}
  </script>
</body>
</html>
