<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E8 김치전 반죽 재료 넣기 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="ui-mini-frame.js"></script>
  <script>
    "use strict";
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
  </script>
  <script src="game-data.js"></script>
  <script src="day4-prep-data.js"></script>
  <script src="mini-engine.js"></script>
  <script src="day-prep-minigames.js"></script>
  <!-- 재료를 다 넣으면 **같은 화면 틀 그대로** 젓기(E9)로 바뀝니다.
       E8 전용 크기 규칙이 그쪽까지 새지 않았는지 ?whisk=1 로 같이 봅니다. -->
  <script src="engine-e9-whisk.js"></script>
  <script src="engine-e8-order-place.js"></script>
  <script>
    "use strict";
    /* ?step=0..3   지금까지 넣은 재료 수 (0 = 첫 화면)
       ?whisk=1     재료 넣기 다음 단계인 젓기(E9) 화면 */
    const params = new URLSearchParams(location.search);
    const step = Math.max(0, Math.min(3, Number(params.get("step")) || 0));
    const whisk = params.get("whisk") === "1";

    loadDayPrepAssets().then(() => {
      state.mini = { context:{ mode:"dayPrep" }, engine:"orderPlace", complete:false, data:null };
      setupKimchiBatter();
      const data = state.mini.data;
      for(let i = 0; i < step; i++) placeOrderedItem(data, data.ingredients[i].id);
      renderKimchiBatterIngredients();
      if(whisk) setupWhiskBatter("kimchiBatter", 0);
      measure();
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });

    function measure(){
      const rect = el => el.getBoundingClientRect();
      const box = el => { const r = rect(el); return `${r.width.toFixed(1)}x${r.height.toFixed(1)}`; };
      const drawn = img => {
        if(!img || !img.naturalWidth) return null;
        const r = rect(img), ratio = img.naturalWidth / img.naturalHeight;
        const w = Math.min(r.width, r.height * ratio), h = Math.min(r.height, r.width / ratio);
        return `${w.toFixed(1)}x${h.toFixed(1)}`;
      };
      const board = document.querySelector(".bt-board");
      const wrap = document.querySelector(".bt-bowl-wrap");
      const bowl = document.querySelector(".bt-bowl");
      const progress = document.querySelector(".bt-progress");
      const hint = document.querySelector(".bt-drag-hint");
      const st = getComputedStyle(board);
      const boardRect = rect(board);
      /* ⚠️ getBoundingClientRect 는 확대된 화면 px, getComputedStyle 은 확대 전 px 입니다.
         섞어서 빼면 값이 통째로 어긋나므로, 잰 값을 먼저 s 로 나눠 확대 전 기준으로 맞춥니다. */
      const s = boardRect.width / parseFloat(st.width);
      const up = v => +(v / s).toFixed(1);
      const innerTop = boardRect.top / s + parseFloat(st.borderTopWidth) + parseFloat(st.paddingTop);
      const innerBottom = boardRect.bottom / s - parseFloat(st.borderBottomWidth) - parseFloat(st.paddingBottom);
      const gapTo = (a, b) => up(rect(b).top - rect(a).bottom);

      document.body.dataset.measure = JSON.stringify({
        step:state.mini.data.step ?? null,
        mode:state.mini.data.mode,
        /* 격자 자체가 커지지 않았는지 봅니다 — 실측 기준은 1360.2 x 613.2 입니다.
           가운데 칸을 키우다 격자를 밀면 좌우 카드까지 같이 늘어납니다. */
        frame:box(document.querySelector(".game-frame")),
        scene:box(document.querySelector(".batter-prep-scene")),
        content:box(document.querySelector(".mini-content")),
        board:{ box:box(board), boardH:up(boardRect.height), inner:+(innerBottom - innerTop).toFixed(1) },
        wrap:{ box:box(wrap), topGap:+(rect(wrap).top / s - innerTop).toFixed(1) },
        bowl:{ box:box(bowl), asset:bowl.classList.contains("has-asset"),
               art:drawn(document.querySelector(".bt-bowl-asset")),
               src:(document.querySelector(".bt-bowl-asset") || {}).src?.split("/").pop() || null },
        bowlToProgress:gapTo(wrap, progress),
        progress:{ box:box(progress),
                   // 글자 아래끝이 도마 안쪽 아래에서 얼마나 떨어져 있는지 (0 이면 선에 붙음)
                   bottomGap:+(innerBottom - rect(progress).bottom / s).toFixed(1),
                   // 도마 테두리 바깥선까지
                   borderGap:up(boardRect.bottom - rect(progress).bottom) },
        // 드래그 안내 점선 (있을 때만)
        hint:hint ? { box:box(hint),
                      leftOfWrap:up(rect(wrap).left - rect(hint).right),
                      midY:up((rect(hint).top + rect(hint).bottom) / 2 - boardRect.top) } : null,
        // 왼쪽 재료 카드 — 기울어지는 연출(.pouring)이 남아 있는지 포함
        cards:[...document.querySelectorAll(".bt-ing-card")].map(c => ({
          id:c.dataset.batterIngredient, card:box(c), next:c.classList.contains("next"),
          added:c.classList.contains("added"), art:drawn(c.querySelector(".bt-ing-asset"))
        }))
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
