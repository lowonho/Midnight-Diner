<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E8 떡·우동면 불려두기 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* game.js 를 통째로 불러오면 페이저까지 딸려 오므로, E8 이 실제로 만지는
       것만 흉내 냅니다 — 전역 state / dom / audio 셋입니다. */
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
  </script>
  <script src="game-data.js"></script>
  <script src="day4-prep-data.js"></script>
  <script src="mini-engine.js"></script>
  <script src="day-prep-minigames.js"></script>
  <script src="engine-e8-order-place.js"></script>
  <script>
    "use strict";
    /* ?kind=tteok|udon    어느 재료인지
       ?water=0..100       물이 얼마나 찼는지 (= 볼 그림 번호)
       ?placed=0           재료를 아직 안 담은 첫 화면 (물은 무시됩니다)
       ?pour=1             물병을 실제로 기울여 봅니다 — 기울인 자세에서 물줄기가
                           볼 안으로 떨어지는지 재려는 것입니다. */
    const params = new URLSearchParams(location.search);
    const kind = params.get("kind") === "udon" ? "udon" : "tteok";
    const water = Math.max(0, Math.min(100, Number(params.get("water")) || 0));
    const placed = params.get("placed") !== "0";

    loadDayPrepAssets().then(() => {
      // 실제 진입로와 같은 함수를 씁니다 — 화면을 베껴 적으면 진짜 화면과 어긋납니다
      state.mini = { context:{ mode:"dayPrep" }, engine:"orderPlace", complete:false, data:null };
      if(kind === "udon") setupUdonSoak(); else setupTteokSoak();
      const data = state.mini.data;
      if(placed){
        data.added[data.ingredientKey] = true;
        placeOrderedItem(data, data.ingredientKey);
        data.water = water;
        if(water >= 100){ data.added.water = true; placeOrderedItem(data, "water"); data.finishing = true; data.completionGrade = "perfect"; }
      }
      renderTteokSoak();
      /* ?lastpour=1 — 75% 에서 **진짜 한 모금**을 부어 100% 를 만듭니다.
         예전에는 여기서 finishSoakWater 가 곧바로 화면을 다시 그려, 방금 붙인
         기울인 자세가 새 DOM 으로 갈려 사라졌습니다("마지막 클릭에서 병이 안 기울어").
         부은 직후에도 물병이 그대로 살아 기울어 있어야 합니다. */
      if(params.get("lastpour") === "1"){
        /* ⚠️ 완료 처리는 여기서 가로챕니다. finishDayPrepTask 는 준비 진행도·다음
           요리 같은 **낮 준비 전체 상태**를 만지는데 이 하네스에는 그게 없어서
           그대로 두면 던집니다(게임 쪽 버그가 아닙니다). 불렀는지만 적어 둡니다. */
        finishDayPrepTask = (taskId) => { document.body.dataset.completed = taskId; };
        const before = document.querySelector(".soak-pitcher");
        startSoakPour();
        const stageEl = document.querySelector(".soak-stage");
        document.body.dataset.lastpour = JSON.stringify({
          water:state.mini.data.water,                       // 100 이어야 합니다
          finishing:state.mini.data.finishing,               // true
          pouring:!!stageEl && stageEl.classList.contains("pouring"),   // true (핵심)
          sameNode:document.querySelector(".soak-pitcher") === before,  // true — 안 다시 그렸다는 뜻
          topFrame:([...document.querySelectorAll(".soak-bowl-asset")]
            .filter(f => f.classList.contains("on")).pop() || {}).src?.split("/").pop() || null
        });
        stopSoakPour();
        return measure();
      }
      if(params.get("pour") === "1"){
        /* ⚠️ startSoakPour 를 그대로 쓰면 안 됩니다. 헤드리스 가상 시간에서는
              이어 붓는 타이머(520ms)가 순식간에 다 흘러 물이 100% 가 되어 버리고,
              기울인 자세를 되돌리는 타이머까지 지나가 **끝난 화면**만 찍힙니다.
              보려는 것은 기울인 한 순간이라 그 자세만 직접 세워 둡니다. */
        document.querySelector(".soak-stage").classList.add("pouring");
        /* ⚠️ 가상 시간에서는 CSS 전환·애니메이션이 저절로 굴러가지 않습니다.
              Animation 객체를 직접 잡아 시각(전환 시간 320ms 끝)을 박아 넣습니다. */
        /* ?at=<ms> 로 멈춰 세울 시각을 고릅니다 (기본 320 = 다 기울인 자세).
           160 아래면 25도, 160 이상이면 45도여야 하고, 둘이 같이 보이면 안 됩니다.
           ⚠️ 물병 자세는 animation 이라 이 시각이 그대로 먹지만, **물줄기는
              transition** 이라 안 먹습니다 — 시작 전(지연 구간)에 멈춰 세운
              전환은 시작값을 붙들지 않아서, at 이 160 아래여도 물줄기가 이미
              나와 있는 것처럼 찍힙니다. 하네스 한계이고 실제 화면은 안 그렇습니다. */
        // ⚠️ `|| 320` 으로 적으면 안 됩니다 — at=0(맨 처음 자세)이 falsy 라 320 으로 샙니다
        const at = Number.isFinite(Number(params.get("at"))) ? Number(params.get("at")) : 320;
        return new Promise(done => requestAnimationFrame(() => {
          document.getAnimations().forEach(a => { a.pause(); try { a.currentTime = at; } catch(e){} });
          done();
        })).then(measure);
      }
      measure();
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });

    function measure(){
      /* 실측용 — 자리와 크기를 DOM 에 박아 --dump-dom 으로 읽습니다 */
      const rect = el => el.getBoundingClientRect();
      const box = el => { const r = rect(el); return `${r.width.toFixed(1)}x${r.height.toFixed(1)}`; };
      // 그림이 상자 안에서 실제로 차지한 크기 (object-fit:contain 결과)
      const drawn = img => {
        if(!img || !img.naturalWidth) return null;
        const r = rect(img), ratio = img.naturalWidth / img.naturalHeight;
        const w = Math.min(r.width, r.height * ratio), h = Math.min(r.height, r.width / ratio);
        return `${w.toFixed(1)}x${h.toFixed(1)}`;
      };
      const stage = document.querySelector(".soak-stage");
      const bowl = document.querySelector(".soaking-bowl");
      const stageRect = rect(stage), bowlRect = rect(bowl);
      // 판(.soak-stage) 왼쪽 위를 0 으로 놓고 잽니다 (1920 프레임 기준 px 로 되돌림)
      const s = stageRect.width / parseFloat(getComputedStyle(stage).width);
      const at = el => { const r = rect(el); return {
        l:+((r.left - stageRect.left) / s).toFixed(1), r:+((r.right - stageRect.left) / s).toFixed(1),
        t:+((r.top - stageRect.top) / s).toFixed(1),   b:+((r.bottom - stageRect.top) / s).toFixed(1) }; };

      const frames = [...document.querySelectorAll(".soak-bowl-asset")];
      const stream = document.querySelector(".soak-pour-stream");
      const pitcher = document.querySelector(".soak-pitcher");
      document.body.dataset.measure = JSON.stringify({
        water:state.mini.data.water,
        stage:box(stage),
        bowl:{ box:box(bowl), at:at(bowl) },
        /* 볼 그림 6장. on 인 장이 위로 이어져야 하고(불투명한 바닥), 맨 위 한 장만 fresh 입니다.
           natural 은 다 같아야 합니다 — 한 장이라도 다르면 물을 부을 때 볼이 들썩입니다. */
        frames:frames.map(f => ({
          src:f.src.split("/").pop(), on:f.classList.contains("on"), fresh:f.classList.contains("fresh"),
          natural:`${f.naturalWidth}x${f.naturalHeight}`, drawn:drawn(f), opacity:+getComputedStyle(f).opacity
        })),
        // 지금 눈에 보이는 맨 위 장 (= 화면에 나오는 볼)
        topFrame:(frames.filter(f => f.classList.contains("on")).pop() || {}).src?.split("/").pop() || null,
        pitcher:{ box:box(pitcher), drawn:drawn(document.querySelector(".soak-pitcher-asset")),
                  asset:pitcher.classList.contains("has-asset"), tilt:pitcher.classList.contains("has-tilt"),
                  disabled:pitcher.disabled, at:at(pitcher) },
        /* 물병 3자세. 붓는 순간에는 45도 장(tilt2)만 불투명해야 하고, 셋 다 같은 크기로
           그려져야 합니다 — 다르면 갈아 끼울 때 병이 커졌다 작아졌다 합니다. */
        pitcherFrames:[...document.querySelectorAll(".soak-pitcher-asset")].map(f => ({
          src:f.src.split("/").pop(), drawn:drawn(f), opacity:+(+getComputedStyle(f).opacity).toFixed(2)
        })),
        /* 지금 보이는 물병 그림의 **위끝이 도마 안쪽 위에서 얼마나 떨어져 있는지**.
           ⚠️ 버튼 상자(.soak-pitcher)를 재면 안 됩니다 — 기울이는 회전이 상자가 아니라
              **그림에** 걸려 있어서, 상자는 안 움직이는데 그림만 위로 솟습니다.
              잘리는지 보려면 그림 쪽을 재야 합니다.
           0 에 가까울수록 도마 위 빈 곳이 없다는 뜻이고, 음수면 잘린 것입니다. */
        pitcherHeadroom:(() => {
          const board = document.querySelector(".soak-board"), st = getComputedStyle(board);
          const innerTop = rect(board).top + parseFloat(st.borderTopWidth) + parseFloat(st.paddingTop);
          const shown = [...document.querySelectorAll(".soak-pitcher-asset")]
            .filter(f => +getComputedStyle(f).opacity > .01);
          if(!shown.length) return null;
          return +(Math.min(...shown.map(f => rect(f).top - innerTop)) / s).toFixed(1);
        })(),
        // 왼쪽 재료 카드 2장 — 그림이 카드 밖으로 넘치지 않아야 합니다
        cards:[...document.querySelectorAll(".soak-ing-card")].map(c => ({
          item:c.dataset.soakItem, card:box(c),
          art:drawn(c.querySelector(".soak-art-asset")),
          src:(c.querySelector(".soak-art-asset") || {}).src?.split("/").pop() || null,
          spill:+(rect(c.querySelector(".soak-ing-art")).bottom - rect(c).bottom).toFixed(1)
        })),
        // 오른쪽 진행도 · 목표 물방울
        drops:[...document.querySelectorAll(".soak-drop-asset")].map(d => ({
          tiny:d.classList.contains("tiny"), box:box(d), drawn:drawn(d)
        })),
        // 임시 CSS 도형이 남아 보이면 안 됩니다
        fallback:{ bowlShape:!bowl.classList.contains("has-asset"),
                   waterFill:!!document.querySelector(".water-fill"),
                   pieces:!!document.querySelector(".soak-bowl-food"),
                   pitcherShape:!pitcher.classList.contains("has-asset"),
                   dropShape:!!document.querySelector(".soak-drop") },
        /* 기울인 자세(?pour=1)에서만 채워집니다.
           streamInBowl : 물줄기 끝이 볼 가로 폭 안에 들어와야 합니다(0~100%).
           overRim      : 물줄기 끝이 볼 윗테두리보다 아래로 내려와 있는지. */
        pouring:(() => {
          if(!stage.classList.contains("pouring")) return null;
          const sr = rect(stream);
          /* ⚠️ 물줄기는 포물선이라 **상자 한가운데로 떨어지지 않습니다.**
             clip-path 다각형에서 물이 닿는 아래끝은 상자 가로 26.82~38.64% 사이,
             그 가운데인 32.73% 입니다. 상자 가운데(50%)로 재면 실제보다
             오른쪽으로 나옵니다. (기울인 그림이 없을 때는 네모라 50% 입니다) */
          const tipRatio = pitcher.classList.contains("has-tilt") ? .3273 : .5;
          return {
            visible:+getComputedStyle(stream).opacity > .05,
            tipX:+(((sr.left + sr.width * tipRatio) - bowlRect.left) / bowlRect.width * 100).toFixed(1) + "%",
            overRim:+((sr.bottom - bowlRect.top) / s).toFixed(1),
            pitcherAt:at(pitcher)
          };
        })()
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
