<!doctype html>
<meta charset="utf-8">
<title>E13_FRIDGE_SORT_PENDING</title>
<body>E13_FRIDGE_SORT_PENDING</body>
<script>
const shuffle=items=>{
  const unique=[...new Set(items)];
  return unique.length>1?items.map((_,index)=>unique[index%unique.length]):[...items];
};
</script>
<script src="../engine-e13-fridge-sort.js"></script>
<script>
try{
  const assert=(condition,message)=>{if(!condition)throw new Error(message)};
  const ids=["fishCake","radish","greenOnion"];
  const built=e13BuildShelves(ids);
  assert(built.length===ids.length+2,"two empty shelves");
  assert(built.filter(shelf=>!shelf.length).length===2,"empty shelf count");
  assert(ids.every(id=>built.flat().filter(item=>item===id).length===3),"three copies per ingredient");
  assert(built.filter(shelf=>shelf.length).every(shelf=>!shelf.every(id=>id===shelf[0])),"no free starting matches");

  const progress=e13CreateProgress(ids.slice(0,2));
  progress.shelves=[[ids[0],ids[0]],[ids[0]],[ids[1],ids[1]],[ids[1]],[],[]];
  let result=e13Move(progress,1,0);
  assert(result.matchedId===ids[0]&&progress.picked.includes(ids[0]),"match collects ingredient");
  assert(e13Undo(progress)&&!progress.picked.includes(ids[0]),"undo restores collection");
  result=e13Move(progress,1,0);
  const hint=e13FindHint(progress);
  assert(hint?.from===3&&hint?.to===2,"hint prefers matching shelf");
  result=e13Move(progress,hint.from,hint.to);
  assert(result.matchedId===ids[1]&&progress.picked.length===2,"all ingredients collected");

  const oneLeft=e13CreateProgress(ids.slice(0,2),[ids[0]]);
  assert(oneLeft.shelves.length===3&&oneLeft.shelves[0].length===2&&oneLeft.shelves[1].length===1,"single remaining ingredient stays solvable");
  assert(e13Move(oneLeft,1,0).matchedId===ids[1],"single remaining ingredient matches");

  const legacy=e13NormalizeProgress({picked:[ids[0]],board:ids},ids.slice(0,2));
  assert(legacy.engine==="E13"&&legacy.picked.length===1,"legacy fridge save migrates to E13");
  assert(legacy.shelves.flat().filter(id=>id===ids[1]).length===3,"migration rebuilds remaining shelves");

  document.title="E13_FRIDGE_SORT_OK";document.body.textContent="E13_FRIDGE_SORT_OK";
}catch(error){document.title="E13_FRIDGE_SORT_FAIL";document.body.textContent=`E13_FRIDGE_SORT_FAIL ${error.stack||error}`;}
</script>
