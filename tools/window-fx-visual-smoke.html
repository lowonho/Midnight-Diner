<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>창밖 연출(새 · 별) visual smoke</title>
  <!-- 에셋 경로가 index.html(루트) 기준입니다. 없으면 tools/assets/... 를 찾다 전부 실패합니다. -->
  <base href="../">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <style>
    body { margin:0; background:#0b0705; }
    #gameCanvas { width:1920px; height:1080px; }
    /* 창문만 보면 되니 화면 전체를 창 쪽으로 확대해서 찍는 모드 */
    body.zoom #gameCanvas { transform:scale(2); transform-origin:945px 237px; }
  </style>
</head>
<body>
  <div id="gameCanvas"></div>

  <script>
    window.addEventListener("error",e=>{document.body.dataset.error=`${document.body.dataset.error||""} | ${e.message} @ ${e.filename}:${e.lineno}`;});
    window.addEventListener("unhandledrejection",e=>{document.body.dataset.error=`rejected: ${e.reason?.message||e.reason}`;});
  </script>

  <script src="js/phaser.min.js"></script>
  <!-- 실제 게임과 같은 파일 · 같은 순서입니다 (index.html 참고) -->
  <script src="js/decoration.js"></script>
  <script src="js/window-fx.js"></script>
  <script src="js/stage.js"></script>

  <script>
    "use strict";
    /* stage.js loadStageAssets() 가 요리사·손님 시트도 같이 받습니다.
       창밖 연출과 무관하고 그 파일들은 game.js 에 얽혀 있어서 여기서만 비워 둡니다.
       배경·장식·창밖 연출은 전부 진짜 파일 그대로 돌립니다. */
    function loadChefSheets(){ return Promise.resolve(); }
    function loadCommonCustomerSheet(){ return Promise.resolve(); }

    const scene = {
      create(){
        loadStageAssets()
          .then(()=>{
            createStage(this);
            document.body.dataset.ready = "1";
          })
          .catch(error=>{ document.body.dataset.error = `load: ${error.message}`; });
      }
    };
    new Phaser.Game(stageGameConfig(scene));

    /* 조작 손잡이. 전부 window-fx.js 의 진짜 함수를 부릅니다 —
       하네스가 연출을 베껴 그리지 않으므로 "스모크만 맞는" 상황이 없습니다. */
    window.SMOKE = {
      day(){ setTimeOfDay("day",true); },
      night(){ setTimeOfDay("night",true); },
      fly(){ stopBird(); flyBird(); },
      twinkle(count=1){ for(let i=0;i<count;i++) twinkleStar(); },
      zoom(on){ document.body.classList.toggle("zoom",!!on); },
      // 새가 지금 어디에 어떤 크기로 떠 있는지. 내용 좌우변까지 같이 돌려줍니다.
      birdInfo(){
        return birdSprites.map(sprite=>{
          const contentW=sprite.displayWidth*WINDOW_FX_BIRD.trim[2]/WINDOW_FX_BIRD.frameW;
          return {
            visible:sprite.visible, flipX:sprite.flipX,
            x:+sprite.x.toFixed(1), y:+sprite.y.toFixed(1),
            contentW:+contentW.toFixed(1),
            left:+(sprite.x-contentW/2).toFixed(1), right:+(sprite.x+contentW/2).toFixed(1)
          };
        });
      },
      starInfo(){
        return starSprites.filter(s=>s.visible).map(s=>({
          x:+s.x.toFixed(1), y:+s.y.toFixed(1),
          w:+s.displayWidth.toFixed(1), frame:s.anims.currentFrame?.index
        }));
      },
      glass(){ return { frame:WINDOW_FRAME_RECT, glass:WINDOW_GLASS_RECT }; }
    };
  </script>
</body>
</html>
