  assert(tofuMenu.requiredPrepTasks.join(",")==="cutTofuKimchi,fryTofuKimchi"&&tofuMenu.cook.map(step=>`${step.station}/${step.game}`).join(",")==="board/chop,fridge/plateKimchi","Tofu cutting moved from prep to first open-hours cook step");
  state.mini={context:{mode:"cook",dishId:"tofu"},complete:false,data:{}};
  MINI_ENGINES.chop.setup(state.mini,{set(){},difficulty:1});
  assert(state.mini.engine==="timing"&&state.mini.data.mode==="timing"&&state.mini.data.ingredient==="tofu"&&state.mini.data.total===6&&state.mini.data.phase==="countdown"&&dom.miniContent.querySelector(".cut-path-mode"),"Open-hours tofu chop uses the shared E1 moving-knife controller");
  assert(SKEWER_BATCH_SIZE===3&&dishById("skewer").prepYield===3,"Chicken skewer batch size");
  assert(SAUCE_RECIPES.tteokbokki.ingredients.map(item=>item.target).join(",")==="120,60,30"&&SAUCE_RECIPES.tteokbokki.ingredients.every(item=>!("step" in item)),"Tteokbokki sauce uses one full pour per ingredient");

  document.title="MINIGAME_LOGIC_OK";document.body.textContent="MINIGAME_LOGIC_OK 99";
}catch(error){
  if(error.message==="E1_PATH_TEST_COMPLETE"){document.title="E1_PATH_LOGIC_OK";document.body.textContent="E1_PATH_LOGIC_OK";}
  else{document.title="MINIGAME_LOGIC_FAIL";document.body.textContent=`MINIGAME_LOGIC_FAIL ${error.stack||error}`;}
}
</script>
