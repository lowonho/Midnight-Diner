<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<body>pending</body>
<script src="../game-data.js"></script>
<script src="../day4-prep-data.js"></script>
<script src="../mini-engine.js"></script>
<script>
const DISHES=MENU_DATA.map(menu=>({...menu,name:menu.displayName,prepTasks:[...menu.requiredPrepTasks],prep:[...(menu.prep||[])],cook:[...(menu.cook||[])]}));
function dishById(id){return DISHES.find(dish=>dish.id===id)||null;}
const state={day:4,phase:GAME_PHASES.PREP,selectedMenus:["tteokbokki","fries"],prepProgress:Object.fromEntries(Object.keys(PREP_TASKS).map(id=>[id,false])),mini:null,kimchiPrep:{}};
const dom={miniFeedback:{textContent:""},miniContent:document.createElement("div"),miniTimer:{textContent:""},miniTitle:{textContent:""},miniStation:{textContent:""},miniDescription:{textContent:""},miniOverlay:document.createElement("div")};
const audio={click(){},success(){},bad(){}};
function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
function shuffle(items){return [...items];}
</script>
<script src="../day.js"></script>
<script src="../day-prep-minigames.js"></script>
<script src="../engine-e1-timing-cut.js"></script>
<script src="../engine-e2-alternate-input.js"></script>
<script src="../engine-e3-direction-seq.js"></script>
<script src="../engine-e4-gauge-hold.js"></script>
<script src="../engine-e5-two-side-cook.js"></script>
<script src="../engine-e6-deep-fry.js"></script>
<script src="../engine-e7-measure.js"></script>
<script src="../engine-e8-order-place.js"></script>
<script src="../engine-e9-whisk.js"></script>
<script src="../engine-e10-target-click.js"></script>
<script src="../engine-e11-one-shot.js"></script>
<script>
try{
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};

  const day4Ids=selectedPrepTasks().map(task=>task.id);
  assert(JSON.stringify(day4Ids)===JSON.stringify(["soakTteok","cutTteokbokkiCabbage","cutTteokbokkiGreenOnion","cutTteokbokkiFishCake","mixTteokbokkiSauce","sliceFriesPotato","shakeFriesStarch"]),`Day 4 order: ${day4Ids}`);

  state.day=3;state.selectedMenus=["yakisoba","shrimpTempura"];
  const day3Ids=selectedPrepTasks().map(task=>task.id);
  assert(day3Ids.length===5&&day3Ids.includes("coatShrimp"),`Day 3 merged shrimp task: ${day3Ids}`);

  state.day=6;state.selectedMenus=["shrimpTempura","fries"];
  const laterIds=selectedPrepTasks().map(task=>task.id);
  assert(laterIds.includes("coatShrimp")&&laterIds.includes("sliceFriesPotato")&&laterIds.includes("shakeFriesStarch"),`Later-day reuse: ${laterIds}`);

  let cutRoute="";
  const originalStartCutting=startCuttingMinigame;
  startCuttingMinigame=()=>{cutRoute="timing";};
  state.day=6;setupTimingCut("cutSkewerChicken");
  startCuttingMinigame=originalStartCutting;
  assert(cutRoute==="timing","E1 must keep timing cuts after Day 4");
  assert(cutTimingGrade(.5,.4,.2)==="perfect"&&cutTimingGrade(.41,.4,.2)==="good"&&cutTimingGrade(.2,.4,.2)==="miss","E1 good/perfect/miss grading");
  assert(CUT_FEEL_CONFIG.doubleTapWindow===.35&&CUT_FEEL_CONFIG.completeDelayMs===620,"E1 feel timing config");
  assert(TTEOKBOKKI_CUT_SEQUENCE.map(item=>item.requiredPieces).join(",")==="8,6,5","E1 tteokbokki cut counts");
  state.mini={context:{mode:"dayPrep"},complete:false,data:{}};
  startCuttingMinigame({taskId:"smokeCut",ingredient:"cabbage",requiredHits:2,hitZoneWidth:.2,speed:.7,zoneStarts:[.4,.4],title:"E1 smoke",description:"smoke"});
  state.mini.data.marker=.5;timingCutAction();
  assert(state.mini.data.successes===1&&state.mini.data.phase==="impact"&&dom.miniContent.querySelector(".cut-board.cut-perfect"),"E1 perfect impact state");
  state.mini={context:{mode:"dayPrep"},complete:false,data:{}};
  startCuttingMinigame({taskId:"smokeChicken",ingredient:"chicken",requiredHits:1,hitZoneWidth:.2,speed:.7,zoneStarts:[.4],requiresDoubleTap:true,title:"E1 chicken smoke",description:"smoke"});
  state.mini.data.marker=.5;timingCutAction();
  assert(state.mini.data.tapStep===1&&state.mini.data.successes===0,"E1 chicken first tap embeds knife");
  timingCutAction();assert(state.mini.data.successes===1&&state.mini.data.phase==="complete","E1 chicken second tap completes cut");

  assert(DAY4_PREP_CONFIG.potatoMandoline.directions.join(",")==="left,right","Potato mandoline must use left/right");
  assert(SHRIMP_COAT_STEPS.map(item=>item.presses).join(",")==="10,8,12"&&PREP_TASKS.coatShrimp,"Shrimp coating counts and merged task");
  assert(DAY4_PREP_CONFIG.potatoStarch.requiredPresses===14,"Fries coating input count");
  assert(DIRECTION_SEQUENCE_CONFIG.kimchi.total===10&&DIRECTION_SEQUENCE_CONFIG.kimchi.directions.length===2,"Kimchi direction config");
  assert(DIRECTION_SEQUENCE_CONFIG.yakisoba.total===12&&DIRECTION_SEQUENCE_CONFIG.yakisoba.directions.length===4,"Yakisoba direction config");
  const e3RepeatSequence=randomFryDirections(["left","right"],10,()=>0);
  assert(e3RepeatSequence.some((direction,index)=>index>0&&direction===e3RepeatSequence[index-1])&&e3RepeatSequence.every((direction,index)=>index<2||direction!==e3RepeatSequence[index-1]||direction!==e3RepeatSequence[index-2]),"E3 sequence allows doubles but not triples");
  assert(directionCompletionGrade({errors:0})==="perfect"&&directionCompletionGrade({errors:1})==="good","E3 grade only counts direction errors");
  assert(HEAT_CONFIG.oden.targetHold===5&&HEAT_CONFIG.tteokbokki.targetHold===5&&HEAT_CONFIG.oden.potAsset!==HEAT_CONFIG.tteokbokki.potAsset&&HEAT_CONFIG.oden.response!==HEAT_CONFIG.tteokbokki.response,"Heat shared config and dish variants");

  const alternate={keys:["a","d"],expectedIndex:0};
  assert(isAlternateTurn(alternate,"a")&&!isAlternateTurn(alternate,"d"),"E2 first alternating key");
  advanceAlternateTurn(alternate,"a");assert(isAlternateTurn(alternate,"d"),"E2 next alternating key");
  const smooth=createAlternateFeelState({keys:["a","d"],expectedIndex:0});
  acceptAlternateInput(smooth,"a",false,1000);acceptAlternateInput(smooth,"d",false,1400);acceptAlternateInput(smooth,"a",false,1800);acceptAlternateInput(smooth,"d",false,2200);
  const paused=createAlternateFeelState({keys:["a","d"],expectedIndex:0});acceptAlternateInput(paused,"a",false,1000);acceptAlternateInput(paused,"d",false,2401);
  assert(alternateCompletionGrade(smooth)==="perfect"&&alternateCompletionGrade(paused)==="good"&&smooth.expectedIndex===0,"E2 completion grade from smooth and paused input");
  state.day=6;state.mini={context:{mode:"dayPrep"},complete:false,data:{}};setupMandoline("sliceFriesPotato");mandolineInput("left",false);
  assert(state.mini.data.successInputs===1&&state.mini.data.expected==="right"&&dom.miniContent.querySelector("#mandolineIngredient.move-left"),"E2 mandoline input and visual state");
  state.mini={context:{mode:"dayPrep"},complete:false,data:{}};setupShrimpCoat(SHRIMP_COAT_TASK_ID);
  for(let index=0;index<SHRIMP_COAT_STEPS[0].presses;index++)shrimpCoatInput(state.mini.data.keys[state.mini.data.expectedIndex],false);
  assert(state.mini.data.transitioning&&state.mini.data.phase==="transition"&&state.mini.data.successes===10&&state.mini.data.stageGrades[0]==="perfect","E2 shrimp first coating transition and grade");

  let finishedScore=null;
  window.finishMini=score=>{finishedScore=score;if(state.mini)state.mini.complete=true;};
  state.mini={context:{mode:"dayPrep"},complete:false,data:{}};setupKimchiFry("fryTofuKimchi");
  const kimchiDirection=state.mini.data.sequence[0];kimchiFryInput(kimchiDirection,false);
  assert(state.mini.data.successes===1&&dom.miniContent.querySelector(".kf-wood-spatula")&&dom.miniContent.querySelector(`#fryWorkArea.stir-${kimchiDirection}`),"E3 kimchi wooden spatula action");
  const stirMini={engine:"stir",complete:false,data:{}};state.mini=stirMini;
  MINI_ENGINES.stir.setup(stirMini,{set:()=>{}});
  const stirDirection=stirMini.data.arrows[0];stirInput(stirDirection,false);
  assert(stirMini.data.index===1&&dom.miniContent.querySelectorAll(".yk-spatula").length===2&&dom.miniContent.querySelectorAll(".yk-noodle").length===22&&dom.miniContent.querySelector(`#stirWorkArea.scrape-${stirDirection}`),"E3 yakisoba twin spatulas and noodle action");
  while(stirMini.data.index<STIR_TOTAL)stirInput(stirMini.data.arrows[stirMini.data.index],false);
  assert(stirMini.data.phase==="complete"&&stirMini.data.inputLocked&&dom.miniContent.querySelector("#e3Result.perfect"),"E3 full sequence grade and delayed completion state");
  state.mini={complete:false,data:{configId:"yakisoba",index:11,errors:0,arrows:Array(12).fill("left")}};
  processDirectionSequenceInput(state.mini,"left",{sequenceKey:"arrows",indexKey:"index",onComplete:()=>finishMini(100)});
  assert(finishedScore===100,"E3 shared controller completion");

  finishedScore=null;
  const heatMini={context:{mode:"cook",dishId:"oden"},complete:false,data:{}};state.mini=heatMini;
  MINI_ENGINES.heat.setup(heatMini,{set:(title,description,time)=>{heatMini.time=time;}});
  const initialHeatPower=heatMini.data.power;
  MINI_ENGINES.heat.key(heatMini,"arrowright",{repeat:false});MINI_ENGINES.heat.update(heatMini,.4);MINI_ENGINES.heat.keyup(heatMini,"arrowright");
  assert(MINI_ENGINES.heat.timerRuns()===false&&heatMini.data.power>initialHeatPower&&dom.miniContent.querySelector(".heat-pot.oden")&&dom.miniContent.querySelectorAll(".heat-flames i").length===5,"E4 hold input, oden pot, and shared flame");
  heatMini.data.enteredZone=true;heatMini.data.value=.1;heatMini.data.inZone=2;heatMini.data.outsideTime=.31;heatMini.data.warnings=0;
  MINI_ENGINES.heat.update(heatMini,.4);
  assert(heatMini.data.inZone<2&&heatMini.data.warnings===1&&heatCompletionGrade(heatMini.data)==="good","E4 grace, decay, and GOOD warning");
  heatMini.data.value=.5;heatMini.data.power=.5;heatMini.data.inZone=4.99;heatMini.data.outsideTime=0;heatMini.data.warnings=0;heatMini.data.enteredZone=true;
  MINI_ENGINES.heat.update(heatMini,.02);
  assert(finishedScore===100&&dom.miniContent.querySelector("#e4Result.perfect"),"E4 perfect completion at hold target");
  const tteokHeatMini={context:{mode:"cook",dishId:"tteokbokki"},complete:false,data:{}};state.mini=tteokHeatMini;
  MINI_ENGINES.heat.setup(tteokHeatMini,{set:()=>{}});
  assert(dom.miniContent.querySelector(".heat-pot.tteokbokki")&&dom.miniContent.querySelectorAll(".heat-tteok").length===4&&tteokHeatMini.data.configId==="tteokbokki","E4 tteokbokki pot variant");
  finishedScore=null;
  for(let tap=0;tap<4;tap++){setHeatControl(tteokHeatMini,1,true);setHeatControl(tteokHeatMini,1,false);}
  for(let frame=0;frame<900&&!tteokHeatMini.complete;frame++)MINI_ENGINES.heat.update(tteokHeatMini,1/60);
  assert(tteokHeatMini.complete&&finishedScore===100,"E4 tteokbokki is completable with four simple heat taps");

  const batter=createOrderPlacementState("batter");
  assert(!placeOrderedItem(batter,"water").accepted,"E8 wrong order must be rejected");
  assert(placeOrderedItem(batter,"flour").accepted&&placeOrderedItem(batter,"water").accepted&&placeOrderedItem(batter,"kimchi").complete,"E8 batter order");
  assert(WHISK_CONFIG.kimchiBatter.target===100&&WHISK_CONFIG.kimchiBatter.taskId==="mixKimchiBatter","E9 data config");
  assert(typeof startOneShot==="function"&&typeof placeOneShotItem==="function","E11 shared one-shot controller");
  state.mini={complete:false,data:{}};
  startOneShot({vessel:ONE_SHOT_VESSELS.plate,items:["tofu","friedKimchi"],onDone:()=>finishMini(100)});
  assert(oneShotData().items.length===2&&oneShotData().vessel===ONE_SHOT_VESSELS.plate,"E11 shared one-shot data");
  assert(SKEWER_BATCH_SIZE===3&&dishById("skewer").prepYield===3,"Chicken skewer batch size");
  assert(SAUCE_RECIPES.tteokbokki.ingredients.map(item=>`${item.target}/${item.step}`).join(",")==="120/30,60/20,30/10","Tteokbokki sauce recipe");

  document.title="MINIGAME_LOGIC_OK";document.body.textContent="MINIGAME_LOGIC_OK 38";
}catch(error){document.title="MINIGAME_LOGIC_FAIL";document.body.textContent=`MINIGAME_LOGIC_FAIL ${error.stack||error}`;}
</script>
