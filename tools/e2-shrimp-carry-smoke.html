<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E2 새우튀김 준비 (꺼내기 · 굴리기 · 되돌려놓기) visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다 — 그러면 "새우 그림이 떴는가" 를 여기서 못 봅니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>
    window.addEventListener("error",e=>{document.body.dataset.error=`${document.body.dataset.error||""} | ${e.message} @ ${e.filename}:${e.lineno}`;});
    window.addEventListener("unhandledrejection",e=>{document.body.dataset.error=`rejected: ${e.reason?.message||e.reason}\n${e.reason?.stack||""}`;});
  </script>
  <script src="ui-mini-frame.js"></script>
  <script src="game-data.js"></script>
  <script src="day4-prep-data.js"></script>
  <script src="mini-engine.js"></script>
  <script>
    "use strict";
    /* game.js 를 통째로 불러오면 페이저까지 딸려 오므로, 이 화면이 실제로
       만지는 전역만 흉내 냅니다 — state / dom / audio / clamp / shuffle / finishMini. */
    const state={day:3,phase:GAME_PHASES.PREP,selectedMenus:["shrimpTempura"],prepProgress:{coatShrimp:false},
      mini:{engine:"shrimpCoat",context:{mode:"dayPrep"},complete:false,data:{}},kimchiPrep:{}};
    const dom={
      miniContent:document.getElementById("miniContent"),miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),miniFeedback:document.getElementById("miniFeedback"),
      miniOverlay:document.getElementById("miniOverlay")
    };
    const audio=new Proxy({},{get:()=>()=>{}});
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function shuffle(items){return [...items];}
    function finishMini(){}
  </script>
  <script src="day.js"></script>
  <script src="prep.js"></script>
  <script src="day-prep-minigames.js"></script>
  <!-- 끌어다 놓기(꺼내기 · 되돌려놓기)는 E8 공용 배치기를 씁니다 -->
  <script src="engine-e8-order-place.js"></script>
  <script src="engine-e2-alternate-input.js"></script>
  <script>
    "use strict";
    /* 이 화면의 본론은 새 플레이 흐름 세 걸음입니다.
         1) 재료칸(.fp-tray-slot.ready) → 그릇(#shrimpCoatVessel) 끌어다 놓기
         2) 그릇 안에서 좌우로 굴리기
         3) 그릇(#shrimpRollSurface) → 재료칸(.fp-ing-panel) 끌어다 놓기
       그래서 화면을 베껴 그리지 않고 **진짜 포인터 입력**으로 굴려 봅니다.

         ?stop=pick|rolling|coated|mid   그 자리에서 멈춰 캡처합니다 (기본 mid)
         ?step=0|1|2                     멈출 단계 (기본 0 = 밀가루)
         ?full=1                         3단계 15마리를 끝까지 돌려 통과 여부만 잽니다 */
    const params=new URLSearchParams(location.search);
    const stopAt=params.get("stop")||"mid";
    const stopStep=Number(params.get("step")??0);

    Promise.all([waitForAssets(),waitForStyles()]).then(async()=>{
      dom.miniOverlay?.classList.add("open");
      settleAnimations();
      try{
        setupShrimpCoat(SHRIMP_COAT_TASK_ID);
        // 포인터 캡처는 헤드리스에서 붙잡아 두면 이어지는 이벤트가 안 옵니다
        dom.miniContent.setPointerCapture=()=>{};
        dom.miniContent.releasePointerCapture=()=>{};
        dom.miniContent.hasPointerCapture=()=>false;
        await (params.get("full")==="1"?runFull():runToStop());
      }catch(error){document.body.dataset.error=`play: ${error.message}\n${error.stack}`;}
      settleAnimations();
      measure();
      document.body.dataset.ready="true";
    });

    function data(){return state.mini.data;}

    // 그림이 한 장이라도 오면 진행합니다. 하나도 없으면 1.5초 뒤 임시 도형으로 진행합니다.
    function waitForAssets(){
      loadDayPrepAssets();
      return new Promise(resolve=>{
        const started=Date.now();
        (function poll(){
          if(Object.keys(dayPrepAssets).length>=10||Date.now()-started>2500)return resolve();
          setTimeout(poll,30);
        })();
      });
    }
    function waitForStyles(){
      if(document.readyState==="complete")return Promise.resolve();
      return new Promise(resolve=>window.addEventListener("load",resolve,{once:true}));
    }

    /* ---- 진짜 포인터 입력 ---- */

    function centerOf(selector){
      const r=document.querySelector(selector)?.getBoundingClientRect();
      if(!r)throw new Error(`없는 자리: ${selector}`);
      return {x:r.left+r.width/2,y:r.top+r.height/2};
    }

    // 1) · 3) 끌어다 놓기. E8 배치기는 5px 넘게 움직여야 '끄는 중'으로 봅니다.
    function dragTo(fromSelector,toSelector){
      const source=document.querySelector(fromSelector);
      if(!source)throw new Error(`잡을 것이 없습니다: ${fromSelector}`);
      source.setPointerCapture=()=>{};source.releasePointerCapture=()=>{};
      const from=centerOf(fromSelector),to=centerOf(toSelector);
      const send=(type,x,y)=>source.dispatchEvent(new PointerEvent(type,
        {pointerId:41,pointerType:"mouse",button:0,clientX:x,clientY:y,bubbles:true,cancelable:true}));
      send("pointerdown",from.x,from.y);
      send("pointermove",(from.x+to.x)/2,(from.y+to.y)/2);
      send("pointermove",to.x,to.y);
      send("pointerup",to.x,to.y);
    }

    /* 2) 그릇 안에서 굴리기. 왕복 거리는 판 폭의 32%(visualLimitRatio)까지고,
       다 묻는 데 판 폭의 220%(requiredTravelRatio)를 지나야 합니다. */
    let rollPointer=200;
    function rollShrimp(strokes=8){
      const shrimp=dom.miniContent.querySelector("#shrimpRollShrimp");
      if(!shrimp)throw new Error("그릇에 새우가 없습니다");
      const surface=dom.miniContent.querySelector(".fp-roll-surface").getBoundingClientRect();
      const mid=surface.left+surface.width/2,reach=surface.width*.3,y=surface.top+surface.height/2;
      const id=rollPointer++;
      shrimp.dispatchEvent(new PointerEvent("pointerdown",{pointerId:id,pointerType:"mouse",button:0,clientX:mid,clientY:y,bubbles:true,cancelable:true}));
      for(let index=0;index<strokes&&!data().board?.coated;index++){
        const x=mid+(index%2?reach:-reach);
        dom.miniContent.dispatchEvent(new PointerEvent("pointermove",{pointerId:id,pointerType:"mouse",clientX:x,clientY:y,bubbles:true,cancelable:true}));
      }
      dom.miniContent.dispatchEvent(new PointerEvent("pointerup",{pointerId:id,pointerType:"mouse",clientX:mid,clientY:y,bubbles:true,cancelable:true}));
    }

    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

    /* 한 마리 = 꺼내기 → 굴리기 → (자동) 되돌아가기.
       셋째 걸음은 손이 아니라 타이머라(E2_FEEL_CONFIG.shrimpReturnMs) 기다립니다. */
    async function coatOne(){
      dragTo(".fp-tray-slot.ready","#shrimpCoatVessel");
      rollShrimp();
      await wait(E2_FEEL_CONFIG.shrimpReturnMs+40);
    }

    // 단계 넘김도 setTimeout(stageTransitionMs) 이라 함께 기다립니다.
    async function runFull(){
      try{
        while(true){
          for(let index=0;index<data().total;index++)await coatOne();
          if(data().step>=data().sequence.length-1)break;
          await wait(E2_FEEL_CONFIG.stageTransitionMs+40);
        }
      }catch(error){document.body.dataset.error=`full: ${error.message}`;}
      const passed=data().phase==="complete"&&data().successes===5&&data().stageGrades.length===3;
      document.body.dataset.result=passed?"pass":"fail";
      document.title=passed?"E2_SHRIMP_CARRY_OK":"E2_SHRIMP_CARRY_FAIL";
      settleAnimations();measure();
    }

    // 보고 싶은 자리까지만 가서 멈춥니다 (캡처용)
    async function runToStop(){
      for(let step=0;step<stopStep;step++){
        for(let index=0;index<data().total;index++)await coatOne();
        // 단계 넘김 타이머를 기다리지 않고 바로 다음 단계로 밀어 둡니다
        data().step=step+1;data().successes=0;data().total=data().sequence[step+1].shrimpCount;
        data().board=null;data().transitioning=false;data().inputLocked=false;data().phase="pick";data().justCompleted=-1;
        renderShrimpCoat();
      }
      if(stopAt==="pick")return;
      if(stopAt==="mid"){await coatOne();await coatOne();}   // 두 마리 마친 뒤 세 마리째
      dragTo(".fp-tray-slot.ready","#shrimpCoatVessel");
      if(stopAt==="rolling"){rollShrimp(3);return;}          // 굴리는 중 (아직 다 안 묻음)
      rollShrimp();                                          // returning : 재료칸으로 날아가는 순간
    }

    function settleAnimations(){
      document.getAnimations().forEach(animation=>{
        const timing=animation.effect?.getTiming()||{};
        if(timing.iterations===Infinity)animation.currentTime=(Number(timing.duration)||0)*.4;
        else{try{animation.finish();}catch(error){/* 이미 끝났습니다 */}}
      });
    }

    /* 화면 배율(--upx) 기준으로 재서, CSS 에 적힌 숫자와 바로 견줄 수 있게 합니다. */
    function measure(){
      const scene=document.querySelector(".fp-scene");if(!scene)return;
      const ruler=document.createElement("i");
      ruler.style.cssText="position:absolute;width:calc(100 * var(--upx))";
      scene.appendChild(ruler);
      const scale=ruler.getBoundingClientRect().width/100||1;
      ruler.remove();
      const size=el=>{if(!el)return null;const r=el.getBoundingClientRect();return `${(r.width/scale).toFixed(1)}x${(r.height/scale).toFixed(1)}`;};
      const slots=[...document.querySelectorAll(".fp-tray-slot")];
      const rollShrimpEl=dom.miniContent.querySelector("#shrimpRollShrimp");
      document.body.dataset.measure=JSON.stringify({
        step:data().step,successes:data().successes,phase:data().phase,
        piece:data().board?{progress:+data().board.progress.toFixed(2),coated:data().board.coated}:null,
        tray:slots.map(slot=>slot.className.replace("fp-tray-slot","").trim()),
        traySlot:size(slots[0]),trayShrimp:size(slots[0]?.querySelector(".fp-shrimp")),
        // 그림이 실제로 붙었는지 — 여기가 비면 "새우 에셋이 또 날아간" 상태입니다
        trayAsset:slots.find(s=>s.querySelector("img"))?.querySelector("img")?.getAttribute("src")||null,
        rollAsset:rollShrimpEl?.querySelector("img")?.getAttribute("src")||null,
        rollShrimp:size(rollShrimpEl),
        vessel:size(document.querySelector("#shrimpCoatVessel")),
        vesselImg:size(document.querySelector("#shrimpCoatVessel .fp-vessel-asset")),
        vesselCss:(()=>{const el=document.querySelector("#shrimpCoatVessel");if(!el)return null;const s=getComputedStyle(el);
          return {cls:el.className,bg:s.backgroundImage.slice(0,40),bgc:s.backgroundColor,shadow:s.boxShadow.slice(0,60),border:s.borderTopWidth+" "+s.borderTopColor};})(),
        sceneBox:size(document.querySelector(".fp-shrimp-roll-scene")),
        board:size(document.querySelector(".fp-board")),
        hint:document.querySelector(".fp-roll-hint")?.textContent
      },null,0);
    }
  </script>
</body>
</html>
