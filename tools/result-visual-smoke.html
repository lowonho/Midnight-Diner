<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>오늘의 영업 기록 — 한 화면 확인</title>
<base href="../" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/hud.css" /><!-- .result-grid 3열 · .retired-economy-ui 숨김이 여기 있습니다 -->
<link rel="stylesheet" href="css/results.css" />
<style>
  /* .overlay 는 position:absolute 라 기준 상자가 있어야 화면을 채웁니다.
     본 게임에선 #gameFrame 이 그 역할이라, 여기선 body 를 그 자리에 세웁니다. */
  html,body { height:100%; margin:0; }
  body { position:relative; background:#140c08; }
</style>
</head>
<body>
<script>
/* 마크업은 베껴 적지 않고 index.html 에서 통째로 꺼내 옵니다 — 실제 화면과
   어긋날 수가 없습니다. file:// 에서 fetch 는 막히지만 동기 XHR 은 됩니다
   (--allow-file-access-from-files 필요). tools/settings-visual-smoke.html 과 같은 방식입니다. */
const xhr=new XMLHttpRequest();
xhr.open("GET","index.html",false);
xhr.send();
const parsed=new DOMParser().parseFromString(xhr.responseText,"text/html");
const overlay=parsed.getElementById("resultOverlay");
if(!overlay){
  document.body.textContent="index.html 에서 #resultOverlay 를 못 찾았습니다.";
}else{
  document.body.append(document.importNode(overlay,true));
  const live=document.getElementById("resultOverlay");
  live.classList.add("open");                 // .overlay 는 .open 이 없으면 안 보입니다

  // js/night.js finishNight() 가 채우는 값들. 가장 긴(두 줄짜리) 문구로 넣어야
  // 칸 높이가 실제 최악의 경우로 잡힙니다.
  document.getElementById("servedResult").textContent="7";
  document.getElementById("satisfactionResult").textContent="아주 좋았어요";
  document.getElementById("fiveStarResult").textContent="모든 접시에 정성이 전해졌어요";
  document.getElementById("resultComment").textContent=
    "손님들이 조용히 웃으며 돌아갔습니다. 오늘의 일반 주문 목표를 모두 마쳤습니다.";

  /* 실측값 심기. ⚠️ rAF 안에서 적으면 --dump-dom 이 그보다 먼저 찍혀 값이 안 나옵니다.
     레이아웃만 필요한 값이라 여기서 바로 잽니다. */
  /* ⚠️ --dump-dom 의 뷰포트는 --window-size 그대로가 아닙니다(브라우저 UI 만큼 좁고
        낮습니다). 그래서 --upx 가 1 이 아닙니다 — 잰 값을 upx 로 나눠 "1920 프레임에서
        몇 px" 로 환산해 적어야 CSS 숫자·빌드 스크립트 크기표와 바로 비교됩니다.
     ⚠️ getComputedStyle 로 --upx 를 읽으면 계산 전 문자열("calc(min(1vw,…)/19.2)")이
        그대로 나옵니다. 자 하나를 실제로 놓고 재야 숫자가 나옵니다. */
  const ruler=document.createElement("div");
  ruler.style.cssText="position:absolute;width:calc(1000 * var(--upx));height:0;";
  document.body.append(ruler);
  const upx=ruler.getBoundingClientRect().width/1000||1;
  ruler.remove();
  const round=v=>Math.round(v/upx*10)/10;
  const box=el=>{const r=el.getBoundingClientRect();return round(r.width)+"x"+round(r.height);};
  document.body.dataset.upx=String(Math.round(upx*10000)/10000);
  // 화면에 실제로 보이는 칸만 (뒤 3개는 .retired-economy-ui 라 display:none 입니다)
  const cells=[...live.querySelectorAll(".result-grid div")].filter(d=>d.getClientRects().length);
  document.body.dataset.window=box(live.querySelector(".result-window"));
  document.body.dataset.cellCount=String(cells.length);
  document.body.dataset.cell=cells.map(box).join(" / ");
  document.body.dataset.button=box(document.getElementById("nextDayButton"));
}
window.addEventListener("error",e=>{document.body.dataset.error=e.message;});
</script>
</body>
</html>
