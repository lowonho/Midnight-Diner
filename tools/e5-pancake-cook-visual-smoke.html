<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E5 김치전 굽기 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다 (tools/e5-skewer-cook-visual-smoke.html 과 같은 이유) -->
  <base href="../">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* game.js 전체 대신 E5 가 실제로 만지는 전역만 흉내 냅니다 */
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    function finishMini(){}
    function miniAction(){}
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
  </script>
  <script src="game-data.js"></script>
  <script src="day4-prep-data.js"></script>
  <script src="mini-engine.js"></script>
  <script src="day-prep-minigames.js"></script>
  <script src="engine-e5-two-side-cook.js"></script>
  <script>
    "use strict";
    /* 보려는 것 : 굽는 김치전 그림 5장이 팬 **안쪽**에 제 크기로 들어가는가,
       익힘 단계가 게이지(marker)를 따라 갈아 끼워지는가, 연기 두 기둥이
       김치전 위에서 피어오르는가.

       ?phase=cook|flip     단계 (기본 cook)
       ?marker=0..1         익힘 게이지 위치 → 익힘 단계가 여기서 나옵니다
       ?side=0|1            앞면(0) / 뒷면(1)
       ?step=0..4           뒷면일 때 앞면이 다다랐던 단계(하한). 안 주면 marker 로만 정합니다 */
    const params = new URLSearchParams(location.search);
    const phase  = params.get("phase") || "cook";
    const marker = Math.max(0, Math.min(1, Number(params.get("marker") ?? .76)));
    const side   = params.get("side") === "1" ? 1 : 0;
    const step   = params.has("step") ? Number(params.get("step")) : 0;

    loadDayPrepAssets().then(() => {
      state.mini = {
        engine:"twoSideCook", complete:false, time:20,
        data:{ phase, side, marker, dir:1, speed:.21, hits:[], dishStyle:"pancake",
               flipErrors:0, cookErrors:0, timeLimit:26, cookStep:step,
               flipCharge:phase === "flip" ? 55 : 0, charging:false }
      };
      dom.miniTitle.textContent = "김치전 굽기";
      dom.miniStation.textContent = TWO_SIDE_VIEW.pancake.subtitle;
      renderTwoSideCook();
      updateTwoSideCookVisual(state.mini.data);
      measure();
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });

    function measure(){
      const rect = el => el && el.getBoundingClientRect();
      const box = el => { const r = rect(el); return r ? `${r.width.toFixed(1)}x${r.height.toFixed(1)}` : "없음"; };
      const board = document.querySelector(".ts-board");
      const pan   = document.querySelector(".two-side-pan");
      const food  = document.querySelector(".cook-food");
      const shown = [...document.querySelectorAll(".pancake-food-asset")].filter(i => i.classList.contains("on"));
      const boardRect = rect(board), panRect = rect(pan), foodRect = rect(food);
      document.body.dataset.measure = JSON.stringify({
        board:box(board), pan:box(pan), food:box(food),
        // 팬이 칸 밖으로 넘치면 안 됩니다 (음수 = 여유)
        panSpill:{
          top:+(boardRect.top - panRect.top).toFixed(1),
          bottom:+(panRect.bottom - boardRect.bottom).toFixed(1)
        },
        // 김치전이 팬 안에 들어와 있는지 (양수 = 팬 안쪽 여백)
        foodRoom:{
          left:+(foodRect.left - panRect.left).toFixed(1),
          right:+(panRect.right - foodRect.right).toFixed(1),
          top:+(foodRect.top - panRect.top).toFixed(1),
          bottom:+(panRect.bottom - foodRect.bottom).toFixed(1)
        },
        cookStep:state.mini.data.cookStep,
        // 켜져 있는 그림 = 지금 단계까지. 맨 뒤가 보이는 장입니다.
        on:shown.map(i => i.getAttribute("src").split("/").pop()),
        smoke:[...document.querySelectorAll(".ts-smoke")].map(s => {
          const r = rect(s);
          return { box:`${r.width.toFixed(1)}x${r.height.toFixed(1)}`,
                   frames:s.querySelectorAll(".ts-smoke-frame").length,
                   // 연기 뿌리(상자 아래 가운데)가 김치전 위에 있는지
                   rootX:+(r.left + r.width / 2 - foodRect.left).toFixed(1),
                   rootY:+(r.bottom - foodRect.top).toFixed(1),
                   // 위로는 팬 밖으로 나가는 것이 정상. 칸(.ts-board) 안에는 남아야 합니다.
                   aboveBoard:+(boardRect.top - r.top).toFixed(1) };
        }),
        // 뺀 것들이 정말 없는지
        flipArrow:!!document.querySelector(".ts-flip-arrow"),
        cssSteam:document.querySelectorAll(".cook-steam").length
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
