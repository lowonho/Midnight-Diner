<!doctype html>
<meta charset="utf-8">
<!-- [base 가 꼭 필요합니다] kitchen.js 의 에셋 경로("assets/utensils/new/…")는
     저장소 루트 기준입니다. 이 파일은 tools/ 안에 있어서 base 없이 열면
     tools/assets/… 를 찾다가 전부 404 가 나고, 그림 대신 도형 플레이스홀더가
     그려집니다. 화면이 그럴듯해 보여서 알아채기 어렵습니다 — 아래 로그의
     "준비된 그림 n/15" 가 0 이면 이 경우입니다. -->
<base href="../">
<title>주방 집기 줄 — visual smoke</title>
<!-- ============================================================
     뒤쪽 조리대 한 줄이 빈틈 없이 이어지는지 눈으로 보는 하네스입니다.

     쓰는 법 (저장소 루트에서):
       npx http-server -p 8123 .        또는 아무 정적 서버
       tools/kitchen-row-visual-smoke.html?phase=day
       tools/kitchen-row-visual-smoke.html?phase=night
       …&clean=1 을 붙이면 안내선 없이 그림만 찍습니다.

     [왜 kitchen.js 를 그대로 불러오나] 배치 계산을 여기 옮겨 적으면
     하네스만 맞고 게임은 틀어지는 일이 생깁니다. 진짜 STATION_LAYOUT 과
     진짜 drawStations() 를 씁니다. 그래서 이 화면이 맞으면 게임도 맞습니다.

     [file:// 로 열면 안 됩니다] 에셋을 <img> 로 불러오므로 http 로 띄워야
     합니다. file:// 은 이미지가 조용히 안 뜨고 빈 화면이 됩니다.
     ============================================================ -->
<style>
  body{margin:0;background:#15100c;color:#cbbfae;font:13px/1.5 Malgun Gothic,sans-serif}
  canvas{display:block;background:#241a12}
  #log{padding:8px 12px;white-space:pre}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="log">불러오는 중…</div>
<script>
  /* kitchen.js 가 로드 시점에 기대하는 전역들. stage.js 와 같은 값입니다. */
  const W=1280, H=720, VIEW_W=1920, VIEW_H=1080;
  const VIEW_SCALE=VIEW_W/W;
  const toView =value=>value*VIEW_SCALE;
  const toLogic=value=>value/VIEW_SCALE;
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

  const params=new URLSearchParams(location.search);
  const state={
    phase:params.get("phase")==="night"?"night":"day",
    paused:false, mini:null, carrying:null,
    player:{x:640,y:500}           // 쓰레기통 앞뒤 판정(trashInFront)이 씁니다
  };

  const canvas=document.getElementById("c");
  const ctx=canvas.getContext("2d");
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
</script>
<script src="kitchen.js"></script>
<script>
  // 집기 그림이 다 준비될 때까지 기다립니다. 안 기다리면 도형 플레이스홀더가 찍힙니다.
  const expected=STATION_SLICES.flatMap(s=>[`${s.id}_day`,...(s.night?[`${s.id}_night`]:[])])
                               .concat(["trash_day","trash_active"]);
  const ready=()=>expected.filter(key=>stationArt[key]);

  function guides(){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.strokeStyle="rgba(255,90,90,.55)"; ctx.lineWidth=1;
    [302,1610].forEach(x=>{ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,VIEW_H);ctx.stroke();});   // 뒤쪽 벽
    ctx.strokeStyle="rgba(120,200,255,.55)";
    ctx.beginPath();ctx.moveTo(0,614.5);ctx.lineTo(VIEW_W,614.5);ctx.stroke();                          // 바닥선
    // 조각 경계 — 여기서 벽이 비쳐 보이면 빈틈이 있는 것입니다
    ctx.strokeStyle="rgba(255,230,120,.35)";
    let x=0;
    STATION_SLICES.forEach(s=>{ x+=s.w;
      const vx=Math.round(toView(STATION_LAYOUT[s.id].canvas.x+STATION_LAYOUT[s.id].canvas.w));
      ctx.beginPath();ctx.moveTo(vx+.5,240);ctx.lineTo(vx+.5,650);ctx.stroke(); });
    ctx.restore();
  }

  function frame(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,VIEW_W,VIEW_H);
    ctx.fillStyle="#241a12"; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.setTransform(VIEW_SCALE,0,0,VIEW_SCALE,0,0);   // kitchen.js 는 논리 좌표로 그립니다
    drawStations();
    if(!params.has("clean")) guides();
    document.getElementById("log").textContent =
      `phase=${state.phase}  준비된 그림 ${ready().length}/${expected.length}` +
      (ready().length<expected.length?`  (아직: ${expected.filter(k=>!stationArt[k]).join(", ")})`:"");
    requestAnimationFrame(frame);
  }
  frame();
  // 캡처 도구가 "다 준비됐다"를 알 수 있게 표시를 남깁니다.
  const done=()=>{ if(ready().length===expected.length) document.title="READY"; else setTimeout(done,60); };
  done();
</script>
