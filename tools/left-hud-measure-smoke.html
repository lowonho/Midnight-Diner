<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>left-hud measure</title>
<!-- 낮 좌측 HUD('오늘의 준비') 높이 실측용. tools/right-hud-measure-smoke.html 과 같은 방식입니다.
     본 게임 캔버스는 필요 없고, 목록 마크업만 js/day.js renderPrepChecklist 와 똑같이 만들어
     **메뉴 3개 조합 56가지를 전부** 재서 가장 긴 경우를 찾습니다.
     ⚠️ 메뉴/준비 작업 데이터는 js/game-data.js 를 그대로 읽으므로 저쪽이 바뀌면 값도 따라 바뀝니다.
        renderPrepChecklist 의 마크업을 고치면 아래 buildChecklist() 도 같이 고쳐야 합니다. -->
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/hud.css" />
<link rel="stylesheet" href="../css/responsive.css" />
<style>
  /* 게임 프레임과 같은 16:9 무대를 1920x1080 로 못박습니다.
     이 크기에서 --upx 가 정확히 1px 이라 CSS 에 적힌 숫자를 그대로 읽을 수 있습니다. */
  html,body{margin:0;background:#120a07;overflow:auto;}
  /* ⚠️ --upx 는 뷰포트에서 나오는데, 헤드리스 --dump-dom 의 뷰포트는 준 --window-size 보다
     100 남짓 낮아서 그냥 두면 실측값이 0.99 배로 나옵니다. 여기서 1px 로 못박아
     "CSS 에 적힌 숫자 = 잰 px" 이 되게 합니다(--screenshot 으로 찍을 때도 같습니다). */
  :root{--upx:1px;}
  .game-frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:#241610;}
  .hidden-hud{opacity:1 !important;}
  /* 재는 동안에는 높이를 풀어 내용 크기로 서게 합니다(실제 CSS 는 height 로 못박혀 있습니다). */
  #leftHud.measuring{height:auto !important;min-height:0 !important;}
</style>
</head>
<body>
<div class="game-app phase-prep" id="gameApp">
  <section class="game-frame">
    <!-- index.html 의 #leftHud 를 그대로 옮긴 것입니다. 구조가 달라지면 여기도 맞추세요. -->
    <aside id="leftHud" class="left-hud wood-panel measuring">
      <div class="panel-heading">
        <strong id="leftTitle">오늘의 준비</strong>
        <span id="phaseBadge" class="badge">낮</span>
      </div>
      <div id="inventoryList" class="inventory-list"></div>
      <button id="phaseButton" class="gold-button" type="button">영업준비 완료</button>
    </aside>
  </section>
</div>

<pre id="out" style="color:#ead8b8;font:13px monospace;padding:12px"></pre>

<script src="../js/game-data.js"></script>
<script>
/* js/day.js renderPrepChecklist() 와 같은 마크업입니다.
   (완료 표시는 글자 수만 늘 뿐 줄 수는 그대로라 '전부 미완료'가 최악값입니다) */
function buildChecklist(dishes){
  const items=dishes.map(dish=>({
    dish,
    tasks:(dish.requiredPrepTasks||[]).map(id=>PREP_TASKS[id]).filter(t=>t&&t.isImplemented)
  }));
  const total=items.reduce((n,item)=>n+item.tasks.length,0);
  const rows=items.map((item,index)=>{
    const subtasks=item.tasks.length
      ? `<div class="prep-subtasks">${item.tasks.map(task=>
          `<div class="prep-subtask">${task.label}</div>`).join("")}</div>`
      : "";
    return `<div class="prep-task-row ${item.tasks.length?"":"disabled"}"><span>${index+1}.</span>`
      +`<strong>${item.displayName||item.dish.displayName}</strong>${subtasks}</div>`;
  }).join("");
  return `<div class="prep-checklist drag-scroll">${rows}</div>`
    +`<div class="prep-total">준비 완료 0 / ${total}</div>`;
}

function combinations(list,pick){
  if(pick===0)return [[]];
  const out=[];
  list.forEach((item,i)=>combinations(list.slice(i+1),pick-1).forEach(rest=>out.push([item,...rest])));
  return out;
}

async function measure(){
  await document.fonts.ready;
  const panel=document.getElementById("leftHud"),list=document.getElementById("inventoryList");
  /* ⚠️ 글꼴이 CDN 입니다. 인터넷이 없으면 예비 글꼴(맑은 고딕)로 재는데, 도트 글꼴은
     줄 간격이 달라서(굵은 글씨 1.0배) 값이 달라집니다. 아래 줄이 O 인지 꼭 확인하세요. */
  const fonts=["12px Galmuri11","12px NeoDunggeunGothicPro"]
    .map(f=>`${f.split(" ")[1]}=${document.fonts.check(f)?"O":"X(예비 글꼴)"}`).join(" · ");
  const results=combinations(MENU_DATA.filter(m=>m.isImplemented),3).map(combo=>{
    list.innerHTML=buildChecklist(combo);
    return {names:combo.map(m=>m.displayName).join(" · "),h:panel.getBoundingClientRect().height};
  }).sort((a,b)=>b.h-a.h);
  const max=results[0],min=results[results.length-1];
  const lines=[
    `글꼴 ${fonts}`,
    `현재 CSS height 규칙: ${getComputedStyle(panel).height} (측정용 override 상태)`,
    `조합 ${results.length}가지 · 프레임 안쪽 높이 1076 기준`,
    "",
    `가장 긴 조합  ${max.h.toFixed(1)}px = ${(max.h/1076*100).toFixed(2)}%   ${max.names}`,
    `가장 짧은 조합 ${min.h.toFixed(1)}px = ${(min.h/1076*100).toFixed(2)}%   ${min.names}`,
    "",
    "상위 6개:",
    ...results.slice(0,6).map(r=>`  ${r.h.toFixed(1)}px  ${r.names}`)
  ];
  // 화면에는 가장 긴 조합을 남겨 둡니다 — 눈으로 볼 때와 캡처용.
  list.innerHTML=buildChecklist(combinations(MENU_DATA.filter(m=>m.isImplemented),3)
    .find(c=>c.map(m=>m.displayName).join(" · ")===max.names));
  document.getElementById("out").textContent=lines.join("\n");
  // --dump-dom 으로 읽을 자리. (rAF 안에 적으면 dump 가 먼저 찍혀 사라집니다)
  document.body.dataset.max=max.h.toFixed(1);
  document.body.dataset.maxPct=(max.h/1076*100).toFixed(2);
  document.body.dataset.report=lines.join(" // ");
}
addEventListener("load",()=>{measure().catch(e=>{document.body.dataset.error=e.message;});});
</script>
</body>
</html>
