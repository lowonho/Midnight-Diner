<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Green onion visual smoke</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/day-prep-minigames.css">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#120b08; }
    main { width:min(900px,90vw); }
    h1 { margin:0 0 18px; color:#f6e4bd; font:700 24px/1.2 sans-serif; text-align:center; }
    .cut-board { width:100%; height:480px; box-sizing:border-box; }
  </style>
</head>
<body>
  <main>
    <h1 id="label"></h1>
    <div class="cut-screen">
      <div class="cut-board">
        <div class="prep-work-object greenOnion-shape has-prep-asset" id="greenOnion">
          <img class="prep-asset prep-object-asset" id="asset" alt="대파 썰기 단계" draggable="false">
          <i class="cut-guide" id="guide"></i>
          <i class="knife-effect"></i>
        </div>
      </div>
    </div>
  </main>
  <script>
    "use strict";
    const stage=Math.max(0,Math.min(7,Number(new URLSearchParams(location.search).get("stage"))||0));
    const work=document.getElementById("greenOnion");
    const guide=document.getElementById("guide");
    document.getElementById("asset").src=`../assets/minigame/E1/green-onion-${stage}.png`;
    document.getElementById("label").textContent=`대파 썰기 에셋 · ${stage} / 7`;
    const cutPositions=[87.7,76.3,63.8,52.6,39,26.6,15.2];
    work.style.setProperty("--cut-x",`${cutPositions[Math.min(stage,6)]}%`);
    if(stage===7)guide.hidden=true;
    document.body.dataset.ready="true";
  </script>
</body>
</html>
