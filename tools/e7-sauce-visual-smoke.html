<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E7 소스 제조 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* game.js 를 통째로 불러오면 페이저까지 딸려 오므로, E7 이 실제로 만지는
       것만 흉내 냅니다 — 전역 state / dom / audio 셋입니다. */
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
  </script>
  <script src="game-data.js"></script>
  <script src="day4-prep-data.js"></script>
  <script src="mini-engine.js"></script>
  <script src="day-prep-minigames.js"></script>
  <script src="engine-e7-measure.js"></script>
  <script>
    "use strict";
    /* ?recipe=tteokbokki|yakisoba  어느 소스인지
       ?poured=0..3                 몇 가지를 넣었는지 (= 소스볼 그림 번호)
       ?cursor=0..2                 지금 고른 소스통
       ?pour=1                      고른 소스통을 실제로 부어 봅니다.
                                    붓는 중간(300ms)에 애니메이션을 멈춰 세우고 재는데,
                                    이때 병이 볼 위로 날아간 자리와 소스볼 그림이
                                    갈아 끼워졌는지(230ms)까지 같이 확인합니다. */
    const params = new URLSearchParams(location.search);
    const recipeId = params.get("recipe") === "yakisoba" ? "yakisoba" : "tteokbokki";
    const poured = Math.max(0, Math.min(3, Number(params.get("poured")) || 0));
    const cursor = Math.max(0, Math.min(2, Number(params.get("cursor")) || 0));

    loadDayPrepAssets().then(() => {
      // 실제 진입로와 같은 함수를 씁니다 — 화면을 베껴 적으면 진짜 화면과 어긋납니다
      state.mini = { context:{ mode:"dayPrep" }, engine:"sauceMeasure", complete:false, data:null };
      setupSauceRecipe(recipeId);
      const data = state.mini.data;
      // 앞에서부터 poured 개를 이미 부어 둔 상태로 만듭니다
      data.sauces.forEach((item, index) => { if(index < poured) item.amount = item.target; });
      data.shownStage = poured;
      data.cursor = cursor;
      if(poured === data.sauces.length){ data.finishing = true; data.pourLocked = true; data.completionGrade = "perfect"; }
      renderYakisobaSauce();
      if(params.get("pour") === "1"){
        addYakisobaSauce(data.sauces[cursor].id);
        /* 붓는 중간에 세워 놓고 잽니다 (병이 볼 위로 날아가 기울어 있는 순간).
           ⚠️ 헤드리스 가상 시간에서는 타이머만 흐르고 **CSS 애니메이션은 안 굴러갑니다.**
              그대로 두면 늘 0% 장면만 찍힙니다. animation-play-state 로 멈춰 봐야
              0% 에서 멈출 뿐입니다 — Animation 객체를 직접 잡아 시각을 박아 넣습니다. */
        return new Promise(done => setTimeout(() => {
          document.getAnimations().forEach(a => { a.pause(); try { a.currentTime = 300; } catch(e){} });
          done();
        }, 300)).then(measure);
      }
      measure();
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });

    function measure(){
      /* 실측용 — 자리와 크기를 DOM 에 박아 --dump-dom 으로 읽습니다 */
      const box = el => { const r = el.getBoundingClientRect(); return `${r.width.toFixed(1)}x${r.height.toFixed(1)}`; };
      const rect = el => el.getBoundingClientRect();
      const board = document.querySelector(".sc-board");
      const bowl = document.querySelector(".sc-bowl");
      const bowlImg = document.querySelector(".sc-bowl-asset");
      const boardRect = rect(board);
      // 그림이 상자 안에서 실제로 차지한 크기 (object-fit:contain 결과)
      const drawn = img => {
        if(!img || !img.naturalWidth) return null;
        const r = rect(img), ratio = img.naturalWidth / img.naturalHeight;
        const w = Math.min(r.width, r.height * ratio), h = Math.min(r.height, r.width / ratio);
        return `${w.toFixed(1)}x${h.toFixed(1)}`;
      };
      // 조리대 안쪽 홈선(824.2 기준 좌 46 · 우 782 · 위 46 · 아래 573)을 밟는지
      const inset = el => {
        const r = rect(el), s = boardRect.width / 824.2, t = boardRect.height / 613.2;
        return { l:+((r.left - boardRect.left) / s).toFixed(1), r:+((r.right - boardRect.left) / s).toFixed(1),
                 t:+((r.top - boardRect.top) / t).toFixed(1), b:+((r.bottom - boardRect.top) / t).toFixed(1) };
      };
      document.body.dataset.measure = JSON.stringify({
        board:box(board),
        bowl:{ box:box(bowl), drawn:drawn(bowlImg), src:bowlImg ? bowlImg.src.split("/").pop() : null, at:inset(bowl) },
        bottles:[...document.querySelectorAll(".sc-pourer")].map(p => ({
          slot:[...p.classList].find(c => c.startsWith("at-")),
          box:box(p.querySelector(".sc-bottle")),
          drawn:drawn(p.querySelector(".sc-bottle-asset")),
          src:(p.querySelector(".sc-bottle-asset") || {}).src?.split("/").pop() || null,
          at:inset(p)
        })),
        arrows:[...document.querySelectorAll(".sc-arrow")].map(a => ({ box:box(a), asset:a.classList.contains("has-asset"), at:inset(a) })),
        goals:[...document.querySelectorAll(".sc-goal")].map(g => ({
          card:box(g), art:drawn(g.querySelector(".sc-bottle-asset"))
        })),
        // 좌 칸 카드가 패널 밖으로 넘치는지 (spill > 0 이면 마지막 카드가 잘립니다)
        spill:(() => {
          const panel = document.querySelector(".sc-ing-panel"), list = document.querySelector(".sc-ing-list");
          const style = getComputedStyle(panel);
          const innerBottom = rect(panel).bottom - parseFloat(style.paddingBottom) - parseFloat(style.borderBottomWidth);
          return +(rect(list).bottom - innerBottom).toFixed(1);
        })(),
        // 임시 CSS 도형이 남아 보이면 안 됩니다
        fallback:{ sauce:!!document.querySelector(".sc-bowl:not(.has-asset)"),
                   bottleShape:!!document.querySelector(".sc-bottle:not(.has-asset)"),
                   arrowShape:!!document.querySelector(".sc-arrow:not(.has-asset)") },
        /* 붓는 중(?pour=1)에만 채워집니다.
           ⚠️ 헤드리스 가상 시간에서는 **CSS 애니메이션이 안 굴러갑니다**(타이머만 흐릅니다).
              그래서 중간 장면을 재는 대신, playSaucePour 가 계산해 심어 둔 값을 그대로 읽습니다.
              이 값들이 병이 날아갈 자리와 줄기 길이를 통째로 정합니다.
           mouthAtSurface : 마개가 소스면 위 stream-height 만큼 떠 있어야 맞습니다(0 이 정답).
           landing        : 날아간 뒤 병 그림 가운데가 볼 안 어디에 오는지 (볼 왼쪽 위 기준). */
        pouring:(() => {
          const p = document.querySelector(".sc-pourer.pouring");
          if(!p) return null;
          const visual = p.querySelector(".sc-pour-visual"), style = getComputedStyle(visual);
          const num = name => parseFloat(style.getPropertyValue(name));
          const bowlR = rect(bowl), streamR = rect(p.querySelector(".sc-pour-stream"));
          // 소스면 — playSaucePour 가 쓰는 자와 같습니다 (볼 위에서 14% 되는 높이)
          const surfaceX = bowlR.left + bowlR.width * .5, surfaceY = bowlR.top + bowlR.height * .14;
          return {
            shownStage:state.mini.data.shownStage, bowlSrc:bowlImg.src.split("/").pop(),
            tilt:style.getPropertyValue("--pour-tilt").trim(),
            finite:["--fly-x","--fly-y","--stream-left","--stream-top","--stream-height"].every(n => Number.isFinite(num(n))),
            // 그려진 그대로 잽니다 (fly · tilt 가 다 먹은 뒤의 자리)
            mouthAtSurface:+(streamR.bottom - surfaceY).toFixed(1),   // 0 이 정답
            streamOffCenter:+(streamR.left + streamR.width / 2 - surfaceX).toFixed(1),
            streamHeight:+streamR.height.toFixed(1),
            streamVisible:+getComputedStyle(p.querySelector(".sc-pour-stream")).opacity > .05,
            // 기울어진 병이 볼 밖으로 나가지 않는지
            bottleOverBowl:+((bowlR.right - rect(p.querySelector(".sc-bottle")).left) / bowlR.width * 100).toFixed(0) + "%"
          };
        })()
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
