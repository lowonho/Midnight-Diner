<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E8 닭꼬치 꽂기 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="js/ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* js/game.js 를 통째로 불러오면 페이저까지 딸려 오므로, E8 이 실제로 만지는
       것만 흉내 냅니다 — 전역 state / dom / audio 셋입니다. */
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
  </script>
  <script src="js/game-data.js"></script>
  <script src="js/day4-prep-data.js"></script>
  <script src="js/mini-engine.js"></script>
  <script src="js/day-prep-minigames.js"></script>
  <script src="js/engine-e8-order-place.js"></script>
  <script>
    "use strict";
    /* 보려는 것 : 빈 칸의 점선 색이 그 칸의 정답 재료와 맞는가, 다음 칸만
       밝게 도드라지는가, 오른쪽 '참고 모양' 이 같은 배치를 보여 주는가.

       ?pattern=chicken,greenOnion,...  1번 꼬치의 정답 배치를 못 박습니다
                                        (안 주면 실제처럼 무작위로 뽑습니다)
       ?filled=0..5                     그 배치대로 아래에서부터 몇 칸을 꽂아 둘지
       ?track=0..2                      몇 번째 꼬치까지 끝내 놓고 볼지 */
    const params = new URLSearchParams(location.search);
    const forced = (params.get("pattern") || "").split(",").filter(item => SKEWER_LABEL[item]);
    const filled = Math.max(0, Math.min(SKEWER_SLOT_COUNT, Number(params.get("filled")) || 0));
    const track  = Math.max(0, Math.min(SKEWER_TOTAL - 1, Number(params.get("track")) || 0));

    loadDayPrepAssets().then(() => {
      // 실제 진입로와 같은 함수를 씁니다 — 화면을 베껴 적으면 진짜 화면과 어긋납니다
      state.mini = { context:{ mode:"dayPrep" }, engine:"orderPlace", complete:false, data:null };
      setupChickenSkewer();
      const data = state.mini.data;
      if(forced.length === SKEWER_SLOT_COUNT) data.patterns[track] = forced;
      // 앞 꼬치들은 정답대로 다 꽂아 둡니다 (진행 칩과 ×숫자가 줄어드는 것도 같이 봅니다)
      for(let index = 0; index < track; index++) data.placements[index] = [...data.patterns[index]];
      data.placements[track] = data.patterns[track].slice(0, filled);
      renderChickenSkewer();
      measure();
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });

    function measure(){
      /* 실측용 — 자리와 크기를 DOM 에 박아 --dump-dom 으로 읽습니다 */
      const rect = el => el.getBoundingClientRect();
      const box = el => { const r = rect(el); return `${r.width.toFixed(1)}x${r.height.toFixed(1)}`; };
      const data = state.mini.data;
      const board = document.querySelector(".sk-board");
      const guide = document.querySelector(".sk-guide");
      // 점선 색은 배경 그림(--sk-dash-*)이라 클래스가 아니라 실제 배경 URL 로 확인합니다
      const dashOf = el => {
        const image = getComputedStyle(el).backgroundImage;
        return /%23ee9d7e/.test(image) ? "chicken" : /%23b2d66e/.test(image) ? "greenOnion" : /fff4d6/.test(image) ? "free" : "none";
      };
      // 화면은 위→아래로 그리므로 정답 배치(아래→위)와 견주려면 뒤집습니다
      const slots = [...document.querySelectorAll(".sk-active-rack .sk-slot")].reverse();
      document.body.dataset.measure = JSON.stringify({
        pattern:data.patterns[track],
        placed:data.placements[track],
        board:box(board),
        // 칸마다 : 채워졌는지 / 점선 색이 정답과 같은지 / 다음 칸인지
        slots:slots.map((slot, index) => ({
          want:data.patterns[track][index],
          filled:slot.classList.contains("filled"),
          dash:slot.classList.contains("filled") ? null : dashOf(slot),
          next:slot.classList.contains("next")
        })),
        // 다음에 꽂을 칸은 딱 한 개여야 합니다
        nextCount:slots.filter(slot => slot.classList.contains("next")).length,
        // 왼쪽 카드의 ×숫자 = 남은 꼬치에서 더 꽂아야 하는 개수
        cards:[...document.querySelectorAll(".sk-ing-card")].map(card => ({
          item:card.dataset.ingredient, card:box(card), disabled:card.disabled,
          count:card.querySelector(".sk-ing-name b").textContent,
          expect:`×${remainingSkewerCount(data, card.dataset.ingredient)}`
        })),
        /* 오른쪽 '참고 모양' — 같은 배치가 위→아래로 그대로 보여야 하고,
           카드(패널) 밖으로 넘치면 안 됩니다(spill 이 0 이하). */
        guide:{
          box:box(guide),
          pieces:[...document.querySelectorAll(".sk-guide-pieces .sk-piece")]
            .map(piece => [...piece.classList].find(name => SKEWER_LABEL[name])),
          expect:[...data.patterns[track]].reverse(),
          spill:+(rect(document.querySelector(".sk-guide-skewer")).bottom - rect(guide).bottom).toFixed(1)
        },
        // 임시 CSS 도형이 남아 보이면 안 됩니다 (에셋이 다 붙었는지)
        fallback:{ pieces:[...document.querySelectorAll(".sk-piece")].some(p => !p.classList.contains("has-asset")),
                   rods:[...document.querySelectorAll(".sk-rod")].some(r => !r.classList.contains("has-asset")) }
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
