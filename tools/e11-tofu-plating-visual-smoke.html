<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E11 두부김치 자유 플레이팅 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* game.js 를 통째로 불러오면 페이저까지 딸려 오므로, E11 이 실제로 만지는
       것만 흉내 냅니다 — 전역 state / dom / audio / finishMini 넷입니다. */
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
    // game.js 의 마무리 처리(점수·다음 손님)는 이 하네스에 없어서 부른 것만 적어 둡니다
    function finishMini(score){ document.body.dataset.finished = String(score); }
  </script>
  <script src="game-data.js"></script>
  <script src="day4-prep-data.js"></script>
  <script src="mini-engine.js"></script>
  <script src="day-prep-minigames.js"></script>
  <script src="engine-e11-one-shot.js"></script>
  <script>
    "use strict";
    /* 자유 플레이팅은 "놓은 자리에 그대로 얹히는가" 가 전부라, 화면을 베껴
       그리지 않고 **진짜 포인터 입력**으로 끌어다 놓고 결과를 잽니다.

       ?place=N     끌어다 놓을 조각 수 (기본 12 = 완성)
       ?outside=1   접시 칸 왼쪽 위 귀퉁이(칸 안이지만 접시 타원 밖)에 놓아 봅니다 —
                    가장자리 안쪽으로 당겨 붙어야 합니다.
                    (칸 자체를 벗어나면 아예 안 놓이고 재료가 카드로 돌아갑니다)
       ?click=1     끌지 않고 카드 → 접시 클릭으로 놓아 봅니다
       ?edge=1      접시 가장자리 여덟 곳(상하좌우 + 대각선)에 몰아 놓아 봅니다 —
                    조각이 접시 밖으로 삐져나오는지 보려는 것입니다 */
    const params = new URLSearchParams(location.search);
    const placeCount = Math.max(0, Math.min(12, Number(params.get("place") ?? 12)));

    /* 끌어다 놓을 자리 12곳. 접시 칸(.os-drop) 기준 0~100 좌표이고,
       일부러 정해진 자리가 아닌 제멋대로인 곳으로 골랐습니다. */
    const DROPS = [
      { id:"tofu", x:30, y:28 }, { id:"friedKimchi", x:52, y:36 },
      { id:"tofu", x:20, y:52 }, { id:"friedKimchi", x:63, y:52 },
      { id:"tofu", x:33, y:73 }, { id:"friedKimchi", x:44, y:58 },
      { id:"tofu", x:70, y:26 }, { id:"friedKimchi", x:57, y:70 },
      { id:"tofu", x:80, y:56 }, { id:"friedKimchi", x:38, y:42 },
      { id:"tofu", x:64, y:76 }, { id:"friedKimchi", x:72, y:38 }
    ];

    loadDayPrepAssets().then(() => {
      state.mini = { context:{ mode:"cook", dishId:"tofu" }, engine:"plateKimchi", complete:false, data:null };
      // 실제 진입로와 같은 함수를 씁니다 — 화면을 베껴 적으면 진짜 화면과 어긋납니다
      MINI_ENGINES.plateKimchi.setup(state.mini, { set(){}, difficulty:1 });

      /* 가장자리 몰아 놓기 — 칸 안이지만 접시 타원 밖인 자리라 전부 가장자리로
         당겨 붙습니다. 두부·김치를 번갈아 놓아 둘 다 확인합니다.
         (칸을 벗어난 좌표를 쓰면 아예 안 놓이므로 0~100 안에서 고릅니다) */
      const EDGES = [[50,1],[99,50],[50,99],[1,50],[8,8],[92,8],[92,92],[8,92]]
        .map(([x,y],i) => ({ id:i % 2 ? "friedKimchi" : "tofu", x, y }));
      const wanted = params.get("edge") === "1" ? EDGES : DROPS.slice(0, placeCount);
      try {
        wanted.forEach(spot => params.get("click") === "1" ? clickPiece(spot) : dragPiece(spot));
        if(params.get("outside") === "1") dragPiece({ id:"tofu", x:3, y:4 });
      } catch(error){ document.body.dataset.error = `place: ${error.message}\n${error.stack}`; }
      measure(wanted);
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });

    // 접시 칸 기준 0~100 좌표를 화면 좌표로 바꿉니다
    function pointAt(px, py){
      const r = document.querySelector(".os-drop").getBoundingClientRect();
      return { x:r.left + r.width * px / 100, y:r.top + r.height * py / 100 };
    }

    /* 진짜 Pointer Events 로 카드에서 접시까지 끕니다.
       ⚠️ setPointerCapture 는 헤드리스에서 붙잡아 두면 이어지는 이벤트가
          안 오므로 비웁니다. 대신 이벤트를 카드에 직접 쏩니다(캡처했을 때와 같습니다). */
    function dragPiece(spot){
      const card = document.querySelector(`[data-os-item="${spot.id}"]`);
      if(!card || card.disabled) return;
      card.setPointerCapture = () => {}; card.releasePointerCapture = () => {};
      const from = card.getBoundingClientRect(), to = pointAt(spot.x, spot.y);
      const send = (type, x, y) => card.dispatchEvent(new PointerEvent(type,
        { pointerId:31, pointerType:"mouse", button:0, clientX:x, clientY:y, bubbles:true, cancelable:true }));
      send("pointerdown", from.left + from.width / 2, from.top + from.height / 2);
      send("pointermove", to.x, to.y);
      send("pointerup", to.x, to.y);
    }

    // 눌러서 집고 → 접시를 눌러 놓는 길
    function clickPiece(spot){
      const card = document.querySelector(`[data-os-item="${spot.id}"]`);
      if(!card || card.disabled) return;
      card.dispatchEvent(new MouseEvent("click", { bubbles:true }));
      const to = pointAt(spot.x, spot.y);
      document.querySelector(".os-drop").dispatchEvent(new MouseEvent("click",
        { clientX:to.x, clientY:to.y, bubbles:true }));
    }

    function measure(wanted){
      const rect = el => el.getBoundingClientRect();
      const drop = document.querySelector(".os-drop"), dropRect = rect(drop);
      /* 화면 배율(--upx). 이 게임의 크기는 전부 calc(N * var(--upx)) 이라,
         잰 px 을 이 값으로 나누면 CSS 가 적어 둔 1920 프레임 기준 N 이 나옵니다.
         ⚠️ getPropertyValue("--upx") 로는 못 읽습니다 — 값이 calc(...) 문자열
            그대로 돌아옵니다. 100upx 짜리 자를 하나 붙여 실측합니다. */
      const ruler = document.createElement("i");
      ruler.style.cssText = "position:absolute;width:calc(100 * var(--upx))";
      drop.appendChild(ruler);
      const scale = ruler.getBoundingClientRect().width / 100 || 1;
      ruler.remove();
      const data = state.mini.data;
      const pieces = [...document.querySelectorAll(".os-drop .os-food.free")];

      /* 놓인 조각 하나하나를 잽니다.
         want  : 끌어다 놓은 자리
         got   : 실제로 그려진 조각의 한가운데 (접시 칸 기준 %)
         off   : 둘의 차이 — 0 에 가까워야 "놓은 자리에 얹혔다" 는 뜻입니다
         reach : 조각 귀퉁이가 접시 테두리까지의 몇 배까지 뻗었는지.
                 1.0 이면 딱 테두리, 1.0 을 넘으면 그만큼 접시 밖입니다.
         over  : 조각이 접시 밖으로 나간 정도 (조각 크기 대비 %). 어림값입니다 —
                 조각을 접시 한가운데에서 뻗은 방향으로 눕혀 놓고 잽니다.
                 "약간 걸치는" 정도를 보는 값이라 0 이 아니어도 됩니다 —
                 25% 안팎까지가 담음새로 보이고, 50% 를 넘으면 떨어진 것처럼 보입니다.
         center: 조각 한가운데는 늘 접시 위여야 합니다(true 가 아니면 규격 위반) */
      const placed = pieces.map((el, index) => {
        const r = rect(el);
        const cx = (r.left + r.width / 2 - dropRect.left) / dropRect.width * 100;
        const cy = (r.top + r.height / 2 - dropRect.top) / dropRect.height * 100;
        const want = wanted[index] || null;
        // 접시 타원(반지름 50) 기준으로 정규화 — 1.0 이 테두리입니다
        const norm = (x, y) => Math.hypot(((x - dropRect.left) / dropRect.width - .5) / .5,
                                          ((y - dropRect.top) / dropRect.height - .5) / .5);
        const reach = Math.max(...[[r.left,r.top],[r.right,r.top],[r.left,r.bottom],[r.right,r.bottom]]
          .map(([x,y]) => norm(x, y)));
        /* 조각이 "접시 한가운데에서 뻗은 방향" 으로 얼마나 두꺼운지.
           네 귀퉁이를 그냥 재면 접시 위쪽·왼쪽에 놓인 조각에서 음수가 나옵니다
           (귀퉁이가 바깥이 아니라 안쪽을 향합니다). 방향을 잡아 투영합니다. */
        const ux = Math.abs((r.left + r.width / 2 - dropRect.left) / dropRect.width - .5);
        const uy = Math.abs((r.top + r.height / 2 - dropRect.top) / dropRect.height - .5);
        const len = Math.hypot(ux, uy) || 1;
        const half = (r.width / dropRect.width / 2 * (ux / len) + r.height / dropRect.height / 2 * (uy / len)) / .5;
        return {
          id:data.placements[index]?.id,
          want:want ? `${want.x},${want.y}` : null,
          got:`${cx.toFixed(1)},${cy.toFixed(1)}`,
          off:want ? +Math.hypot(cx - want.x, cy - want.y).toFixed(2) : null,
          size:`${r.width.toFixed(1)}x${r.height.toFixed(1)}`,
          rot:data.placements[index]?.rot,
          reach:+reach.toFixed(3),
          over:half > 0 ? +Math.max(0, (norm(r.left + r.width / 2, r.top + r.height / 2) + half - 1) / (2 * half) * 100).toFixed(1) : null,
          center:norm(r.left + r.width / 2, r.top + r.height / 2) <= 1
        };
      });

      document.body.dataset.measure = JSON.stringify({
        plate:`${dropRect.width.toFixed(1)}x${dropRect.height.toFixed(1)}`,
        total:oneShotTotal(data),
        done:oneShotDoneCount(data),
        left:{ tofu:oneShotLeft(data,"tofu"), friedKimchi:oneShotLeft(data,"friedKimchi") },
        // 왼쪽 카드에 남은 개수가 그대로 적혀야 하고, 0 이면 꺼져야 합니다
        /* 왼쪽 카드. art 는 그림이 실제로 차지한 크기를 1920 프레임 기준 px 로
           되돌린 값입니다 — tools/build-minigame-art-webp.js 의 E11 목표 크기가
           이 값의 2배여야 합니다(어긋나면 흐려지거나 용량만 먹습니다). */
        cards:[...document.querySelectorAll(".os-ing-card")].map(c => {
          const art = c.querySelector(".os-art-asset"), r = art && rect(art);
          return {
            item:c.dataset.osItem, count:c.querySelector(".os-ing-name b").textContent, disabled:c.disabled,
            art:r ? `${(r.width / scale).toFixed(1)}x${(r.height / scale).toFixed(1)}` : null
          };
        }),
        // 접시 · 참고 모양도 같은 기준으로 재 둡니다 (표의 근거)
        design:{
          plate:`${(dropRect.width / scale).toFixed(1)}x${(dropRect.height / scale).toFixed(1)}`,
          /* 접시 그림이 상자를 꽉 채우는지. 상자와 어긋나면 "접시 위" 판정이
             눈에 보이는 접시와 어긋납니다(FREE_PLATE_RADIUS 가 헛돕니다). */
          plateArt:(() => { const a = document.querySelector(".os-drop .os-vessel-asset");
            if(!a || !a.naturalWidth) return null;
            const r = rect(a), ratio = a.naturalWidth / a.naturalHeight;
            const w = Math.min(r.width, r.height * ratio), h = Math.min(r.height, r.width / ratio);
            return `${(w / scale).toFixed(1)}x${(h / scale).toFixed(1)}`; })(),
          guide:(() => { const g = document.querySelector(".os-guide-figure .os-vessel");
            const r = g && rect(g); return r ? `${(r.width / scale).toFixed(1)}x${(r.height / scale).toFixed(1)}` : null; })(),
          piece:(() => { const p = document.querySelector(".os-food.free .os-art-asset");
            const r = p && rect(p); return r ? `${(r.width / scale).toFixed(1)}x${(r.height / scale).toFixed(1)}` : null; })()
        },
        counter:document.querySelector(".os-count strong")?.textContent.trim(),
        // 접시에 그려진 조각들 — 여기가 이 하네스의 본론입니다
        placed,
        worstOff:Math.max(0, ...placed.map(p => p.off ?? 0)),
        // 가장 많이 삐져나온 조각이 얼마나 걸쳤는지 / 한가운데는 전부 접시 위인지
        worstOver:Math.max(0, ...placed.map(p => p.over ?? 0)),
        allCentersOnPlate:placed.every(p => p.center),
        finishing:!!data.finishing,
        complete:!!document.querySelector(".os-board.variant-free.complete"),
        hintGone:!document.querySelector(".os-drag-hint"),
        // 오른쪽 참고 모양에도 예시 11조각이 그려집니다
        guidePieces:document.querySelectorAll(".os-guide-figure .os-food.free").length,
        // 그림 파일이 아직 없으니 임시 CSS 도형이 보여야 정상입니다
        fallback:{ plateShape:!!document.querySelector(".os-vessel.plate:not(.has-asset)"),
                   pieceShape:!!document.querySelector(".os-food.free .os-art:not(.has-asset)") },
        feedback:dom.miniFeedback.textContent
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
