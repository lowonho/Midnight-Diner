<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E6 튀기기 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. FRY_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>
    // 오류는 덧붙입니다 — 앞선 파일이 못 뜬 것이 진짜 원인인데 뒤 오류가 덮어쓰면 못 찾습니다
    window.addEventListener("error",e=>{document.body.dataset.error=`${document.body.dataset.error||""} | ${e.message} @ ${e.filename}:${e.lineno}`;});
    // 재기 · 그리기가 전부 Promise 안에서 돌아갑니다. 이게 없으면 그 안의 오류가
    // 조용히 사라져 "빈 화면인데 원인이 안 보이는" 상태가 됩니다.
    window.addEventListener("unhandledrejection",e=>{document.body.dataset.error=`rejected: ${e.reason?.message||e.reason}\n${e.reason?.stack||""}`;});
  </script>
  <script src="js/ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* js/game.js 를 통째로 불러오면 페이저까지 딸려 오므로, E6 이 실제로 만지는
       것만 흉내 냅니다 — 전역 state / dom / audio / clamp / finishMini 다섯입니다. */
    const state = { day:4, mini:null };
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    /* 밤 조리는 js/game.js 의 DISHES 를 넘겨주지만, E6 이 보는 것은 dish.id 하나뿐입니다.
       js/game.js 를 통째로 부르면 페이저까지 딸려 오므로 여기서는 그 한 칸만 흉내 냅니다. */
    function dishById(id){ return MENU_DATA.find(menu => menu.id === id); }
    // js/game.js 의 마무리 처리(점수·다음 손님)는 이 하네스에 없어서 부른 것만 적어 둡니다
    function finishMini(score){ document.body.dataset.finished = String(score); }
  </script>
  <script src="js/game-data.js"></script>
  <script src="js/mini-engine.js"></script>
  <script src="js/engine-e6-deep-fry.js"></script>
  <script>
    "use strict";
    /* 이 화면의 본론은 "끌어다 놓은 자리에 그대로 들어가는가" 와
       "익힘 3단계가 시간대로 갈리는가" 둘입니다. 그래서 화면을 베껴 그리지 않고
       **진짜 포인터 입력**으로 끌어다 놓고 결과를 잽니다.

       ?dish=fries   감자튀김으로 엽니다 (기본은 새우튀김)
       ?drop=N       냄비에 넣을 재료 수 (기본 3 = 정원)
       ?cook=SEC     넣은 뒤 흘려 볼 시간(초). 3.4 미만 설익음 / 7.6 미만 잘 익음 / 그 뒤 탐
       ?lift=N       망으로 건질 개수 (기본 0)
       ?full=1       5개를 전부 잘 익은 상태로 건져 완성까지 갑니다
       ?hold=1       마지막 끌기를 **손을 떼지 않은 채로** 멈춥니다.
                     집게 커서가 튀김을 물고 있는 모습(아래팔 → 튀김 → 윗팔)을
                     캡처할 때 씁니다. 이 상태에서는 냄비에 아무것도 안 들어갑니다. */
    const params = new URLSearchParams(location.search);
    const dishId = params.get("dish") === "fries" ? "fries" : "shrimpTempura";
    const dropCount = Math.max(0, Math.min(FRY_COOK.potLimit, Number(params.get("drop") ?? FRY_COOK.potLimit)));
    const cookSeconds = Number(params.get("cook") ?? 0);
    const liftCount = Math.max(0, Number(params.get("lift") ?? 0));

    // 냄비 칸(.fry-pot) 기준 0~100 좌표. 일부러 기본 자리가 아닌 곳으로 골랐습니다.
    // 한 번에 다섯 개까지 들어가므로 자리도 다섯입니다(FRY_COOK.potLimit).
    const DROPS = [{ x:41, y:33 }, { x:60, y:38 }, { x:66, y:58 }, { x:38, y:70 }, { x:50, y:52 }];

    const mini = { engine:"fry", context:{ mode:"cook", dishId }, complete:false, data:{} };

    /* ⚠️ 그림은 new Image() 로 따로 받아서 document 의 load 를 붙잡지 않습니다.
       기다리지 않고 바로 그리면 파일이 있는데도 임시 도형만 잡힙니다.
       한 장이라도 뜨면(= 있는 파일은 다 왔다는 뜻) 진행하고, 하나도 없으면
       1.5초 뒤 임시 도형 그대로 진행합니다(감자튀김은 아직 그림이 없습니다). */
    Promise.all([waitForFryAssets(), waitForStyles()]).then(() => {
      /* ⚠️ 진짜 게임과 같이 .open 을 붙입니다. 이게 없으면 css/minigame-frame.css 의
         손 그림 커서 규칙(.mini-overlay.open ...)이 안 걸려서, E6 이 그 규칙을
         제대로 눌렀는지(cursor:none) 여기서 확인할 수가 없습니다.
         ⚠️ 붙이자마자 **패널이 아래에서 올라오는 연출(mg-rise)이 시작됩니다.**
            그 상태로 끌어다 놓으면 놓는 자리가 창 밖(약 1000 아래)이라 냄비에
            아무것도 안 들어갑니다. 그래서 바로 연출을 끝으로 보냅니다. */
      document.getElementById("miniOverlay")?.classList.add("open");
      settleAnimations();
      state.mini = mini;
      // 실제 진입로와 같은 함수를 씁니다 — 화면을 베껴 적으면 진짜 화면과 어긋납니다
      // set 은 js/game.js 가 제목·설명·부제를 채우는 자리입니다. 같은 세 곳을 채웁니다.
      MINI_ENGINES.fry.setup(mini, { dish:dishById(dishId), set:(title,description,time) => {
        mini.time = time;
        dom.miniTitle.textContent = title;
        dom.miniDescription.textContent = description;
        setMiniSubtitle("fry");
      } });
      try {
        if (params.get("full") === "1") runFullClear();
        else {
          DROPS.slice(0, dropCount).forEach(spot => dragTo("[data-fry-source='raw']", ".fry-pot", spot));
          tick(cookSeconds);
          for (let i = 0; i < liftCount; i++) {
            const piece = document.querySelector("[data-fry-source='piece']");
            if (piece) dragTo(`[data-fry-piece='${piece.dataset.fryPiece}']`, ".fry-rack", { x:50, y:50 });
          }
          // 집게가 물고 있는 모습을 보려고 마지막 하나를 손에 쥔 채로 멈춥니다
          if (params.get("hold") === "1") {
            const held = document.querySelector("[data-fry-source='piece']") || document.querySelector("[data-fry-source='raw']");
            if (held) dragTo(`[data-fry-source='${held.dataset.frySource}']`, ".fry-pot", { x:52, y:44 }, true);
          }
        }
      } catch (error) { document.body.dataset.error = `play: ${error.message}\n${error.stack}`; }
      settleAnimations();
      measure();
    });

    function waitForFryAssets(){
      return new Promise(resolve => {
        const started = Date.now();
        (function poll(){
          if (Object.keys(fryAssets).length || Date.now() - started > 1500) return resolve();
          setTimeout(poll, 30);
        })();
      });
    }

    /* ⚠️ **스타일시트를 기다려야 합니다.** 그림이 먼저 오면 CSS 가 아직 안 붙은
       상태로 끌어다 놓기가 시작되는데, 그때 .fry-pot 은 그냥 div 라 화면 아래
       한참 밖에 있습니다. 그러면 놓는 자리가 창 밖(예: y=1426)이 되어
       elementFromPoint 가 null 을 돌려주고, **냄비에 아무것도 안 들어간 채로**
       "냄비가 비었다" 는 결과만 남습니다 — 게임이 멀쩡한데 스모크만 깨집니다.
       (그림 용량이 바뀔 때마다 붙었다 떨어졌다 하는 종류의 함정입니다) */
    function waitForStyles(){
      if (document.readyState === "complete") return Promise.resolve();
      return new Promise(resolve => window.addEventListener("load", resolve, { once:true }));
    }

    /* 5개를 전부 '잘 익은' 상태로 건져 완성까지 가 봅니다.
       다섯 개가 한 번에 들어가므로 보통 한 바퀴에 끝납니다 — 그래도 나눠 넣는
       플레이가 깨지지 않게 넣기 → 익히기 → 건지기 반복 구조는 그대로 둡니다. */
    function runFullClear(){
      while (mini.data.done.length < 5 && !mini.data.finishing) {
        while (mini.data.raw && mini.data.pot.length < FRY_COOK.potLimit) dragTo("[data-fry-source='raw']", ".fry-pot", DROPS[mini.data.pot.length]);
        tick(4);   // 3.4 ~ 7.6 사이 = 잘 익음
        [...document.querySelectorAll("[data-fry-source='piece']")].forEach(piece => {
          if (mini.data.finishing) return;
          dragTo(`[data-fry-piece='${piece.dataset.fryPiece}']`, ".fry-rack", { x:50, y:50 });
        });
      }
    }

    // update 를 60fps 로 나눠 돌립니다(한 번에 큰 dt 를 주면 단계 전환을 건너뜁니다)
    function tick(seconds){
      for (let t = 0; t < seconds; t += 1/60) MINI_ENGINES.fry.update(mini, 1/60);
    }

    // 칸 기준 0~100 좌표를 화면 좌표로 바꿉니다
    function pointIn(selector, px, py){
      const r = document.querySelector(selector).getBoundingClientRect();
      return { x:r.left + r.width * px / 100, y:r.top + r.height * py / 100 };
    }

    /* 진짜 Pointer Events 로 끕니다.
       ⚠️ setPointerCapture 는 헤드리스에서 붙잡아 두면 이어지는 이벤트가
          안 오므로 비웁니다. 대신 이벤트를 잡은 요소에 직접 쏩니다. */
    function dragTo(fromSelector, toSelector, spot, keepHolding = false){
      const card = document.querySelector(fromSelector);
      if (!card || card.disabled) return;
      card.setPointerCapture = () => {}; card.releasePointerCapture = () => {};
      const from = card.getBoundingClientRect(), to = pointIn(toSelector, spot.x, spot.y);
      const send = (type, x, y) => card.dispatchEvent(new PointerEvent(type,
        { pointerId:31, pointerType:"mouse", button:0, clientX:x, clientY:y, bubbles:true, cancelable:true }));
      send("pointerdown", from.left + from.width / 2, from.top + from.height / 2);
      send("pointermove", to.x, to.y);
      if (!keepHolding) send("pointerup", to.x, to.y);
    }

    /* 재는 시점에 아직 돌고 있는 연출을 정리합니다.
         한 번짜리(떨어지기·물결) → 끝으로 보냅니다.
       ⚠️ 이게 없으면 방금 넣은 조각이 **기름으로 떨어지는 도중**에 잡혀,
          자리(off)도 크기도 실제와 다르게 나옵니다 — 자리 검사가 통째로 무의미해집니다.
         무한 반복(기포·기름 방울) → 한 바퀴의 40% 지점으로 맞춰 세웁니다.
       ⚠️ finish() 는 무한 반복에서 예외를 던집니다. 그냥 두면 캡처 순간의 위상이
          매번 달라서, 기포가 마침 사라진 프레임에 잡히면 "연출이 없다" 로 오해합니다. */
    function settleAnimations(){
      document.getAnimations().forEach(animation => {
        const timing = animation.effect?.getTiming() || {};
        if (timing.iterations === Infinity) animation.currentTime = (Number(timing.duration) || 0) * .4;
        else { try { animation.finish(); } catch (error) { /* 이미 끝났습니다 */ } }
      });
    }

    function measure(){
      const rect = el => el.getBoundingClientRect();
      const screen = document.querySelector(".fry-screen"), pot = document.querySelector(".fry-pot");
      const potRect = rect(pot);
      /* 화면 배율(--upx). 이 게임의 크기는 전부 calc(N * var(--upx)) 이라,
         잰 px 을 이 값으로 나누면 CSS 가 적어 둔 1920 프레임 기준 N 이 나옵니다.
         ⚠️ getPropertyValue("--upx") 로는 못 읽습니다 — calc(...) 문자열이 그대로 옵니다. */
      const ruler = document.createElement("i");
      ruler.style.cssText = "position:absolute;width:calc(100 * var(--upx))";
      pot.appendChild(ruler);
      const scale = ruler.getBoundingClientRect().width / 100 || 1;
      ruler.remove();
      const size = el => { const r = rect(el); return `${(r.width/scale).toFixed(1)}x${(r.height/scale).toFixed(1)}`; };
      const data = mini.data;

      // 냄비 안 조각. want 는 끌어다 놓은 자리, got 은 실제로 그려진 한가운데입니다.
      const inPot = [...document.querySelectorAll(".fry-pot-food .fry-piece")].map((el, index) => {
        const r = rect(el);
        const cx = (r.left + r.width/2 - potRect.left) / potRect.width * 100;
        const cy = (r.top + r.height/2 - potRect.top) / potRect.height * 100;
        const want = DROPS[index];
        /* reach : 조각 귀퉁이가 냄비 테두리까지의 몇 배까지 뻗었는지. 1.0 이 딱 테두리입니다.
           ⚠️ 잰 사각형(getBoundingClientRect)은 **돌아간 뒤의 바깥 상자**라 실제
              그림보다 큽니다. 그림 자체의 상자(offsetWidth/Height)로 재야 눈에
              보이는 것과 맞습니다. 그림 네 귀퉁이도 대개 투명해서 이것도 넉넉한 값입니다. */
        const half = Math.hypot(el.offsetWidth, el.offsetHeight) / 2;
        return {
          stage:el.dataset.stage, t:+(data.pot[index]?.t ?? 0).toFixed(2),
          want:want ? `${want.x},${want.y}` : null,
          got:`${cx.toFixed(1)},${cy.toFixed(1)}`,
          off:want ? +Math.hypot(cx-want.x, cy-want.y).toFixed(2) : null,
          size:size(el),
          reach:+((Math.hypot(r.left+r.width/2 - (potRect.left+potRect.width/2),
                              r.top+r.height/2 - (potRect.top+potRect.height/2)) + half)
                  / (potRect.width/2)).toFixed(3)
        };
      });

      const rackRect = document.querySelector(".fry-rack") && rect(document.querySelector(".fry-rack"));
      const onRack = [...document.querySelectorAll(".fry-rack-food .fry-piece")].map(el => {
        const r = rect(el);
        return {
          stage:el.dataset.stage, size:size(el),
          // 망 밖으로 삐져나오면 안 됩니다
          inside: r.left >= rackRect.left - 1 && r.right <= rackRect.right + 1
               && r.top >= rackRect.top - 1 && r.bottom <= rackRect.bottom + 1
        };
      });

      document.body.dataset.measure = JSON.stringify({
        dish:data.fryerStyle,
        title:dom.miniTitle.textContent, subtitle:dom.miniStation.textContent,
        // 3열 격자가 613.2 를 다 쓰는지 · 하단 띠가 아예 없는지가 이 화면의 규격입니다
        screen:size(screen),
        stripCount:document.querySelectorAll(".fry-screen .mg-strip").length,
        cols:{ raw:size(document.querySelector(".fry-ing-panel")),
               work:size(document.querySelector(".fry-work-area")),
               progress:size(document.querySelector(".fry-progress-card")),
               rackPanel:size(document.querySelector(".fry-rack-panel")) },
        pot:size(pot),
        rack:rackRect ? size(document.querySelector(".fry-rack")) : null,
        rawCards:document.querySelectorAll(".fry-raw-item").length,
        rawArt:document.querySelector(".fry-raw-item img") ? size(document.querySelector(".fry-raw-item img")) : null,
        counter:document.querySelector(".fry-progress-value")?.textContent.trim(),
        left:data.raw, potCount:data.pot.length, doneCount:data.done.length,
        inPot, worstOff:Math.max(0, ...inPot.map(p => p.off ?? 0)),
        /* ⚠️ 냄비가 비었으면 **참이 아니라 null 입니다.** every 는 빈 배열에서 늘 참이라,
           끌어다 놓기가 통째로 실패해 아무것도 안 들어간 판을 "다 잘 들어갔다" 로
           읽게 됩니다 — 실제로 그렇게 한 번 속았습니다. */
        allInsideOil:inPot.length ? inPot.every(p => p.reach <= 1) : null,
        onRack, allOnRack:onRack.every(p => p.inside),
        // 그림 파일이 있는 쪽은 <img>, 없는 쪽은 임시 CSS 도형이어야 정상입니다
        assets:{ piece:!!document.querySelector(".fry-piece .fry-art-asset") || !!document.querySelector(".fry-raw-item .fry-art-asset"),
                 shape:!!document.querySelector(".fry-art"),
                 burner:!!document.querySelector(".fry-burner-asset"),
                 potShape:!!document.querySelector(".fry-pot-shape"), rackShape:!!document.querySelector(".fry-rack-shape") },
        /* 집게 커서. held 는 지금 물고 있는 튀김, drips 는 거기서 떨어지는 기름 방울입니다.
           tongs 가 false 면 그림을 못 받아 기본 포인터로 돌아간 것입니다. */
        tongs:(() => {
          const cursor = document.querySelector(".fry-cursor");
          if (!cursor) return null;
          const held = cursor.querySelector(".fry-piece.held");
          return { closed:cursor.classList.contains("closed"), holding:cursor.classList.contains("holding"),
                   size:size(cursor), held:held ? size(held) : null,
                   heldStage:held?.dataset.stage ?? null,
                   drips:cursor.querySelectorAll(".fry-oil-drip").length,
                   // 아래팔 → 튀김 → 윗팔 순서로 쌓여 있는지 (이 순서라야 물고 있는 것처럼 보입니다)
                   layerOrder:[...cursor.children].map(child => child.className.replace("fry-tongs ", "")).join(">") };
        })(),
        /* 이 화면 안에서는 진짜 마우스 포인터가 통째로 숨어야 합니다(집게가 대신합니다).
           ⚠️ css/minigame-frame.css 가 미니게임 패널 전체에 손 그림 커서를 !important
              로 박아 두므로, 여기 값이 "none" 이 아니면 집게 옆에 손가락이 같이
              따라다닙니다 — 눈으로만 보면 놓치기 쉬워서 수치로 남깁니다.
           바깥(제목 줄)은 손 그림 그대로여야 합니다. */
        cursor:{ screen:getComputedStyle(screen).cursor,
                 card:document.querySelector(".fry-raw-item") ? getComputedStyle(document.querySelector(".fry-raw-item")).cursor : null,
                 pot:getComputedStyle(pot).cursor,
                 outside:document.querySelector(".mini-title-panel")
                   ? getComputedStyle(document.querySelector(".mini-title-panel")).cursor.slice(0,9) : null },
        // 기름에 잠긴 느낌 : 조각 투명도 + 그 위를 덮는 기름막 한 겹
        oil:{ veil:!!document.querySelector(".fry-oil-veil"),
              sunkOpacity:document.querySelector(".fry-pot-food .fry-piece")
                ? getComputedStyle(document.querySelector(".fry-pot-food .fry-piece")).opacity : null,
              idleBubbles:document.querySelectorAll(".fry-oil-bubbles i").length,
              fizzGroups:document.querySelectorAll(".fry-fizz").length },
        finishing:!!data.finishing, grade:data.completionGrade,
        score:document.body.dataset.finished ?? null,
        result:document.querySelector("#e6Result")?.textContent ?? null,
        hint:document.getElementById("miniTipHint")?.textContent,
        feedback:dom.miniFeedback.textContent
      });
      document.body.dataset.ready = "true";
    }
  </script>
</body>
</html>
