<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E2 새우튀김 준비 visual smoke</title>
  <!-- ⚠️ 기준 경로를 저장소 루트로 옮깁니다. DAY_PREP_ASSET_PATHS 의 경로가
       index.html(루트) 기준이라, 이게 없으면 tools/assets/... 를 찾다 전부 실패해
       임시 CSS 도형만 보입니다. 아래 경로도 전부 루트 기준으로 적습니다. -->
  <base href="../">
  <!-- 실제 게임과 같은 순서 · 같은 파일입니다 (index.html 참고) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/minigame-parts.css">
  <link rel="stylesheet" href="css/minigames.css">
  <link rel="stylesheet" href="css/day-prep-minigames.css">
  <link rel="stylesheet" href="css/minigame-frame.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin:0; display:grid; place-items:center; background:#0b0705; }
    /* 오버레이는 평소 숨어 있습니다 — 스모크에서는 항상 켭니다 */
    .mini-overlay { display:flex !important; opacity:1 !important; visibility:visible !important; pointer-events:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- .active 가 없으면 .app-screen 이 display:none 이라 화면이 통째로 0x0 이 됩니다 -->
    <main class="app-screen game-screen active">
      <section class="game-app">
        <section class="game-frame">
          <div id="miniFrameMount"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 게임 파일을 그대로 불러다 씁니다. 화면을 베껴 적으면 진짜 화면과 어긋납니다. -->
  <!-- 헤드리스 캡처에서도 원인이 보이도록 오류를 body 에 적어 둡니다 -->
  <script>window.addEventListener("error",e=>{document.body.dataset.error=`${e.message} @ ${e.filename}:${e.lineno}`;});</script>
  <script src="js/ui-mini-frame.js"></script>
  <script>
    "use strict";
    /* js/game.js 를 통째로 불러오면 페이저까지 딸려 오므로, E2 가 실제로 만지는
       것만 흉내 냅니다 — 전역 state / dom 두 개입니다. */
    /* 프레임은 js/ui-mini-frame.js 가 로드되면서 #miniFrameMount 자리에 스스로 붙입니다 */
    const state = { day:3, mini:null };
    // 효과음은 js/game.js 것이라 여기서는 삼킵니다 (부르기만 하고 결과를 안 봅니다)
    const audio = new Proxy({}, { get:() => () => {} });
    const dom = {
      miniContent:document.getElementById("miniContent"),
      miniTimer:document.getElementById("miniTimer"),
      miniTitle:document.getElementById("miniTitle"),
      miniStation:document.getElementById("miniStation"),
      miniDescription:document.getElementById("miniDescription"),
      miniFeedback:document.getElementById("miniFeedback")
    };
  </script>
  <script src="js/game-data.js"></script><!-- E8 이 로드 시점에 SKEWER_BATCH_SIZE 를 읽습니다 -->
  <script src="js/day4-prep-data.js"></script>
  <script src="js/mini-engine.js"></script>
  <script src="js/day-prep-minigames.js"></script>
  <script src="js/engine-e2-alternate-input.js"></script>
  <!-- 새우 옮기기가 E8 의 공용 포인터 배치기를 씁니다 (bindOrderPlacementPointers) -->
  <script src="js/engine-e8-order-place.js"></script>
  <script>
    "use strict";
    /* ?step=0..2 (밀가루·계란물·빵가루) · ?percent=0..100 (묻은 정도)
       ?carry=1  단계를 끝내고 다음 그릇으로 새우를 옮기는 차례
       ?roll=1   새우가 옆으로 넘어간 상태 (연타할 때마다 뒤집히는 그 상태) */
    const params = new URLSearchParams(location.search);
    const step = Math.max(0, Math.min(2, Number(params.get("step")) || 0));
    const carry = params.get("carry") === "1" && step < SHRIMP_COAT_STEPS.length - 1;
    const percent = carry ? 100 : Math.max(0, Math.min(100, Number(params.get("percent")) ?? 0));
    const item = SHRIMP_COAT_STEPS[step];
    const successes = Math.round(item.presses * percent / 100);

    loadDayPrepAssets().then(() => {
      state.mini = {
        // isDayPrepMini() 가 보는 것은 context.mode 하나입니다 (js/day-prep-minigames.js)
        context:{ mode:"dayPrep" }, engine:"shrimpCoat", complete:false,
        data:createAlternateFeelState({ mode:"shrimpCoat", taskId:SHRIMP_COAT_TASK_ID, step,
               sequence:SHRIMP_COAT_STEPS, keys:["f","j"], expectedIndex:0,
               successes, total:item.presses, rolled:params.get("roll") === "1",
               phase:carry ? "carry" : "play", inputLocked:carry, transitioning:carry })
      };
      dom.miniTitle.textContent = "새우튀김 준비";
      dom.miniStation.textContent = "튀김가루, 계란물, 빵가루를 순서대로 묻혀주세요!";
      dom.miniDescription.textContent = carry
        ? `새우를 ${SHRIMP_COAT_STEPS[step + 1].label} 그릇으로 끌어다 놓으세요!`
        : `${item.label} 안에서 새우를 좌우로 여러 번 굴려주세요.`;
      renderShrimpCoat();
      /* 실측용 — 자리와 크기를 콘솔이 아니라 DOM 에 박아 스크린샷에서도 읽힙니다 */
      const box = el => { const r = el.getBoundingClientRect(); return `${r.width.toFixed(1)}x${r.height.toFixed(1)}`; };
      const board = document.querySelector(".fp-board");
      const row = document.querySelector(".fp-coat-row");
      const vessels = [...document.querySelectorAll(".fp-vessel")];
      const shrimp = document.querySelector(".fp-shrimp");
      document.body.dataset.measure = JSON.stringify({
        board:box(board), row:box(row),
        vessels:vessels.map(box), shrimp:shrimp?box(shrimp):null,
        overflow:{ x:row.getBoundingClientRect().width > board.clientWidth,
                   y:row.getBoundingClientRect().height > board.clientHeight },
        assets:{ vessel:!!document.querySelector(".fp-vessel-asset"),
                 shrimp:!!document.querySelector(".fp-shrimp-asset"),
                 ing:document.querySelectorAll(".fp-ing-asset").length },
        /* 왼쪽 재료 칸 — 카드 4장이 패널 밖으로 넘치는지 봅니다.
           list 아래끝이 panel 안쪽 아래끝보다 크면 마지막 카드가 잘립니다. */
        ing:(() => {
          const panel = document.querySelector(".fp-ing-panel");
          const list = document.querySelector(".fp-ing-list");
          const cards = [...document.querySelectorAll(".fp-ing-card")];
          const style = getComputedStyle(panel);
          const innerBottom = panel.getBoundingClientRect().bottom - parseFloat(style.paddingBottom) - parseFloat(style.borderBottomWidth);
          return {
            panel:box(panel), list:box(list), card:cards.map(box),
            art:[...document.querySelectorAll(".fp-ing-art")].map(box),
            asset:[...document.querySelectorAll(".fp-ing-asset")].map(box),
            spill:+(list.getBoundingClientRect().bottom - innerBottom).toFixed(1)
          };
        })()
      });
      document.body.dataset.ready = "true";
    }).catch(error => { document.body.dataset.error = `render: ${error.message}`; });
  </script>
</body>
</html>
